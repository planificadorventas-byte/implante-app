        "14001":"Proteger el medio ambiente, prevenir la contaminación y usar los recursos de forma sostenible.",
        "45001":"Proporcionar condiciones de trabajo seguras y saludables y prevenir lesiones y deterioro de la salud.",
        "22000":"Garantizar la inocuidad de los alimentos a lo largo de toda la cadena.",
        "27001":"Preservar la confidencialidad, integridad y disponibilidad de la información.",
        "42001":"Desarrollar y usar sistemas de inteligencia artificial de forma responsable, justa y transparente.",
        "37001":"Prohibir el soborno en todas sus formas y actuar con integridad.",
        "50001":"Mejorar de forma continua el desempeño energético y la eficiencia.",
        "haccp":"Asegurar la inocuidad de los alimentos mediante el control de los peligros significativos.",
      };
      return `<h2>Declaración de política</h2><p>La Dirección de <b>${esc(sys.org)}</b> establece la presente política como marco de referencia de su Sistema de Gestión ${sys.norms.length>1?"Integrado ":""} y asume los siguientes compromisos:</p>
      <ul>${sys.norms.map(n=>`<li>${esc(compromisos[n]||"Cumplir los requisitos aplicables.")}</li>`).join("")}
      <li>Cumplir los requisitos legales, reglamentarios y otros requisitos que la organización suscriba.</li>
      <li>Establecer y revisar objetivos medibles coherentes con esta política.</li>
      <li>Mejorar continuamente la eficacia del sistema de gestión.</li>
      <li>Comunicar esta política y asegurar que es entendida por todo el personal.</li></ul>
      <h2>Aprobación</h2><p>Esta política es comunicada, está disponible para las partes interesadas y se revisa para su continua adecuación.</p>
      <table><thead><tr><th>Aprobado por</th><th>Cargo</th><th>Fecha</th></tr></thead><tbody><tr><td>${esc(sys.responsible||"—")}</td><td>Dirección</td><td>${fmtDate((sys.createdAt||stamp()).slice(0,10))}</td></tr></tbody></table>`;
    },
    objetivos:(doc,sys)=>{
      const ej = {
        "9001":["% de satisfacción del cliente","≥ 90%"],"14001":["Reducción de consumo energético","-5% anual"],
        "45001":["Índice de frecuencia de accidentes","-10% anual"],"22000":["Nº de incidencias de inocuidad","0"],
        "27001":["% de incidencias de seguridad resueltas en plazo","≥ 95%"],"42001":["% de sistemas de IA con evaluación de impacto","100%"],
        "37001":["% de personal formado en antisoborno","100%"],"50001":["Mejora del IDEn","+3% anual"],"haccp":["Cumplimiento de límites críticos","100%"],
      };
      return `<h2>Objeto</h2><p>Establecer objetivos coherentes con la política, medibles y con planificación para alcanzarlos.</p>
      <h2>Objetivos del sistema</h2>
      <table><thead><tr><th>Norma</th><th>Objetivo</th><th>Meta</th><th>Indicador</th><th>Responsable</th><th>Plazo</th></tr></thead><tbody>
      ${sys.norms.map(n=>{const e=ej[n]||["Objetivo del sistema","Definir"];return `<tr><td>${normChip(n)}</td><td>${esc(e[0])}</td><td>${esc(e[1])}</td><td>Seguimiento periódico</td><td>Resp. del proceso</td><td>Anual</td></tr>`;}).join("")}
      </tbody></table>
      <h2>Planificación</h2><p>Para cada objetivo se define: qué se hará, qué recursos se requieren, quién es responsable, cuándo finalizará y cómo se evaluarán los resultados.</p>`;
    },
    riesgos:(doc,sys)=>{
      return buildGeneric(doc,sys).replace("<h2>Desarrollo</h2>", `<h2>Metodología de evaluación</h2><p>Los riesgos y oportunidades se valoran según su <b>probabilidad</b> e <b>impacto</b> en una escala 1–5. El nivel de riesgo = Probabilidad × Impacto.</p>
      <table><thead><tr><th>Nivel</th><th>Rango</th><th>Tratamiento</th></tr></thead><tbody>
        <tr><td>Bajo</td><td>1–4</td><td>Asumir / seguimiento.</td></tr>
        <tr><td>Medio</td><td>5–12</td><td>Planificar acciones de reducción.</td></tr>
        <tr><td>Alto</td><td>15–25</td><td>Acción prioritaria e inmediata.</td></tr>
      </tbody></table><h2>Desarrollo</h2>`);
    },
    "control-doc":(doc,sys)=>{
      const objeto=`<h2>Objeto</h2><p>Definir el control de la información documentada del sistema de gestión de <b>${esc(sys.org)}</b>: creación, aprobación, distribución, uso y conservación.</p>`;
      const steps=stepsBlock([
        "<b>Identificación:</b> cada documento se identifica con código, título, versión y fecha.",
        "<b>Elaboración y revisión:</b> el responsable del proceso elabora y revisa el documento antes de su aprobación.",
        "<b>Aprobación:</b> la Dirección o persona autorizada aprueba antes de su distribución.",
        "<b>Distribución y acceso:</b> se garantiza que las versiones vigentes están disponibles donde se necesitan.",
        "<b>Control de cambios:</b> los cambios generan nueva versión, registrada en el control de cambios.",
        "<b>Documentos obsoletos:</b> se retiran o identifican para evitar su uso no intencionado.",
        "<b>Documentos externos:</b> se identifican y controla su distribución.",
        "<b>Conservación:</b> se definen tiempos de retención y modo de conservación de los registros.",
      ]);
      return objeto+`<h2>Alcance</h2><p>Aplica a toda la información documentada del sistema.</p>`+refBlock(sys)+defBlock()+
        `<h2>Codificación</h2><p>Formato: <span class="mono">TIPO-NN</span> (p. ej. PG-01 procedimiento general, PE-01 específico, REG-01 registro).</p>`+
        `<h2>Responsabilidades</h2>`+roleTable([["Responsable del Sistema","Mantener el maestro de documentos y controlar versiones."],["Responsables de proceso","Elaborar y mantener actualizados sus documentos."],["Alta Dirección","Aprobar documentos clave."]])+
        steps+recordsBlock(["Maestro / listado de documentos y registros","Registros con su periodo de conservación"]);
    },
    auditoria:(doc,sys)=>{
      const objeto=`<h2>Objeto</h2><p>Planificar y ejecutar auditorías internas para verificar que el sistema es conforme y está implantado eficazmente.</p>`;
      const steps=stepsBlock([
        "<b>Programa anual:</b> se establece considerando la importancia de los procesos y resultados de auditorías previas.",
        "<b>Auditores:</b> se designan competentes e independientes del área auditada.",
        "<b>Plan de auditoría:</b> alcance, criterios, fechas y auditados.",
        "<b>Ejecución:</b> reunión inicial, recogida de evidencias, reunión de cierre.",
        "<b>Informe:</b> se documentan conformidades, no conformidades y oportunidades de mejora.",
        "<b>Seguimiento:</b> las no conformidades se tratan según el procedimiento de acción correctiva.",
      ]);
      return objeto+`<h2>Alcance</h2><p>Todos los procesos y requisitos de ${sys.norms.map(n=>esc(NORMS[n].code)).join(", ")}.</p>`+refBlock(sys,["ISO 19011 — Directrices para la auditoría de sistemas de gestión"])+defBlock([["Hallazgo","Resultado de la evaluación de la evidencia de auditoría frente a los criterios."]])+steps+recordsBlock(["Programa anual de auditorías","Plan de auditoría","Informe de auditoría interna","Lista de verificación (checklist)"]);
    },
    revision:(doc,sys)=>{
      return `<h2>Objeto</h2><p>Establecer la sistemática de revisión del sistema de gestión por la alta dirección para asegurar su conveniencia, adecuación y eficacia.</p>
      <h2>Periodicidad</h2><p>Con carácter mínimo anual, y siempre que se produzcan cambios significativos.</p>
      <h2>Entradas de la revisión</h2><ul><li>Estado de acciones de revisiones previas.</li><li>Cambios en cuestiones internas/externas y partes interesadas.</li><li>Grado de cumplimiento de objetivos.</li><li>Desempeño: no conformidades, resultados de auditorías, indicadores.</li><li>Adecuación de los recursos.</li><li>Eficacia de las acciones frente a riesgos y oportunidades.</li><li>Oportunidades de mejora.</li></ul>
      <h2>Salidas de la revisión</h2><ul><li>Decisiones sobre oportunidades de mejora.</li><li>Necesidades de cambio en el sistema.</li><li>Necesidades de recursos.</li></ul>
      ${refBlock(sys)}${recordsBlock(["Acta de revisión por la dirección","Plan de acciones derivadas"])}`;
    },
    noconf:(doc,sys)=>{
      return `<h2>Objeto</h2><p>Definir el tratamiento de las no conformidades y la gestión de acciones correctivas.</p>
      <h2>Desarrollo</h2><ol>
      <li><b>Detección y registro</b> de la no conformidad.</li>
      <li><b>Corrección inmediata</b> para controlar y corregir la desviación y hacer frente a las consecuencias.</li>
      <li><b>Análisis de causa raíz</b> (p. ej. 5 porqués, Ishikawa).</li>
      <li><b>Acción correctiva</b> para eliminar la causa y evitar la recurrencia.</li>
      <li><b>Implantación</b> de las acciones y asignación de responsables y plazos.</li>
      <li><b>Verificación de la eficacia</b> de la acción antes del cierre.</li>
      <li><b>Actualización</b> de riesgos y del sistema si procede.</li>
      </ol>
      ${refBlock(sys)}${recordsBlock(["Registro de no conformidades","Registro de acciones correctivas","Evidencia de verificación de eficacia"])}`;
    },
    /* --- 14001 --- */
    "14001-aspectos":(doc,sys)=>{
      const sd=sectorData(sys.sector);
      return `<h2>Objeto</h2><p>Identificar y evaluar los aspectos ambientales de las actividades de <b>${esc(sys.org)}</b> para determinar los significativos.</p>
      <h2>Metodología</h2><p>Se evalúa cada aspecto según criterios de <b>magnitud</b>, <b>frecuencia</b>, <b>peligrosidad</b> y <b>requisito legal</b>. Los que superan el umbral definido se consideran significativos.</p>
      <h2>Identificación de aspectos (sector ${esc(sys.sector.toLowerCase())})</h2>
      <table><thead><tr><th>Aspecto ambiental</th><th>Impacto asociado</th><th>Condición</th></tr></thead><tbody>
      ${sd.aspectos.map(a=>`<tr><td>${esc(a)}</td><td>Alteración del entorno / agotamiento de recursos</td><td>Normal / anormal</td></tr>`).join("")}
      </tbody></table>
      ${refBlock(sys)}${recordsBlock(["Registro de identificación y evaluación de aspectos","Listado de aspectos significativos"])}`;
    },
    "int-legal":(doc,sys)=>{
      const sd=sectorData(sys.sector);
      return `<h2>Objeto</h2><p>Identificar, acceder y evaluar el cumplimiento de los requisitos legales y otros requisitos aplicables al sistema.</p>
      <h2>Registro de requisitos legales (ejemplos para el sector)</h2>
      <table><thead><tr><th>Requisito</th><th>Ámbito</th><th>Evaluación de cumplimiento</th></tr></thead><tbody>
      ${sd.legal.map(l=>`<tr><td>${esc(l)}</td><td>${sys.norms.includes("45001")?"SST / ":""}${sys.norms.includes("14001")?"Ambiental":"General"}</td><td>Conforme / a evaluar</td></tr>`).join("")}
      </tbody></table>
      <h2>Evaluación del cumplimiento</h2><p>El cumplimiento legal se evalúa periódicamente (mínimo anual) y sus resultados se incorporan a la revisión por la dirección.</p>
      ${refBlock(sys)}${recordsBlock(["Registro de requisitos legales","Evaluación del cumplimiento legal"])}`;
    },
    "int-emergencias":(doc,sys)=>{
      const sd=sectorData(sys.sector);
      return `<h2>Objeto</h2><p>Establecer la preparación y respuesta ante situaciones de emergencia potenciales que puedan tener consecuencias para ${sys.norms.includes("14001")?"el medio ambiente, ":""}${sys.norms.includes("45001")?"la seguridad y salud, ":""}${sys.norms.includes("22000")?"la inocuidad alimentaria ":""}y la continuidad de la actividad.</p>
      <h2>Situaciones de emergencia potenciales</h2><ul><li>Incendio o explosión.</li><li>Derrame o fuga de sustancias.</li><li>Accidente grave / emergencia médica.</li><li>Fallo de suministros críticos.</li>${sys.norms.includes("22000")?"<li>Contaminación del producto.</li>":""}</ul>
      <h2>Actuación</h2><ol><li>Detección y activación del aviso.</li><li>Aplicación del plan y roles de emergencia.</li><li>Evacuación / contención según el caso.</li><li>Comunicación a servicios externos.</li><li>Restablecimiento y análisis posterior.</li></ol>
      <h2>Simulacros</h2><p>Se realizan periódicamente (mínimo anual) y se evalúa la respuesta para mejorar el plan.</p>
      ${refBlock(sys)}${recordsBlock(["Plan de emergencia","Registro de simulacros","Registro de actuaciones ante emergencias"])}`;
    },
    /* --- 45001 --- */
    "45001-peligros":(doc,sys)=>{
      const sd=sectorData(sys.sector);
      return `<h2>Objeto</h2><p>Establecer la metodología de identificación de peligros y evaluación de riesgos para la seguridad y salud en el trabajo.</p>
      <h2>Metodología</h2><p>Riesgo = <b>Probabilidad</b> × <b>Severidad</b>. Se prioriza según la jerarquía de controles: eliminar, sustituir, controles de ingeniería, controles administrativos y EPI.</p>
      <h2>Peligros identificados (sector ${esc(sys.sector.toLowerCase())})</h2>
      <table><thead><tr><th>Peligro</th><th>Riesgo asociado</th><th>Medida de control tipo</th></tr></thead><tbody>
      ${sd.peligros.map(p=>`<tr><td>${esc(p)}</td><td>Lesión / daño a la salud</td><td>Control de ingeniería / procedimiento / EPI</td></tr>`).join("")}
      </tbody></table>
      ${refBlock(sys)}${recordsBlock(["Evaluación de riesgos por puesto","Planificación de la actividad preventiva"])}`;
    },
    "45001-consulta":(doc,sys)=>`<h2>Objeto</h2><p>Garantizar la consulta y participación de los trabajadores en el sistema de gestión de la SST.</p>
      <h2>Mecanismos</h2><ul><li>Comité de seguridad y salud / delegados de prevención.</li><li>Reuniones periódicas y canales de sugerencias.</li><li>Consulta ante cambios que afecten a la SST.</li><li>Participación en la investigación de incidentes y en la evaluación de riesgos.</li></ul>
      ${refBlock(sys)}${recordsBlock(["Actas de reuniones","Registro de consultas y sugerencias"])}`,
    "45001-incidentes":(doc,sys)=>`<h2>Objeto</h2><p>Definir la notificación e investigación de incidentes para determinar sus causas y evitar su repetición.</p>
      <h2>Desarrollo</h2><ol><li>Notificación inmediata del incidente.</li><li>Atención y aseguramiento de la zona.</li><li>Investigación y análisis de causa raíz.</li><li>Definición de acciones correctivas.</li><li>Comunicación de lecciones aprendidas.</li></ol>
      ${refBlock(sys)}${recordsBlock(["Parte de notificación de incidente","Informe de investigación"])}`,
    /* --- 22000 / HACCP --- */
    "22000-analisis":(doc,sys)=>haccpHazard(sys),
    "haccp-analisis":(doc,sys)=>haccpHazard(sys),
    "22000-plan":(doc,sys)=>haccpPlan(sys),
    "haccp-plan":(doc,sys)=>haccpPlan(sys),
    "haccp-flujo":(doc,sys)=>`<h2>Objeto</h2><p>Documentar el diagrama de flujo del proceso, base para el análisis de peligros.</p>
      <h2>Etapas del proceso</h2><ol>${sectorData(sys.sector).procesos.map(p=>`<li>${esc(p.charAt(0).toUpperCase()+p.slice(1))}</li>`).join("")}</ol>
      <p class="muted">El diagrama de flujo debe verificarse in situ por el equipo HACCP y actualizarse ante cualquier cambio.</p>${recordsBlock(["Diagrama de flujo verificado","Registro de verificación in situ"])}`,
    "haccp-producto":(doc,sys)=>`<h2>Descripción del producto</h2><table><thead><tr><th>Característica</th><th>Descripción</th></tr></thead><tbody>
      <tr><td>Denominación</td><td>Producto elaborado por ${esc(sys.org)}</td></tr>
      <tr><td>Composición</td><td>A completar según ficha técnica.</td></tr>
      <tr><td>Características fisicoquímicas</td><td>pH, aw, tratamiento térmico (a definir).</td></tr>
      <tr><td>Envasado y conservación</td><td>A definir.</td></tr>
      <tr><td>Vida útil</td><td>A definir.</td></tr>
      <tr><td>Uso previsto</td><td>Consumo por la población general (indicar grupos vulnerables si aplica).</td></tr>
      </tbody></table>${recordsBlock(["Ficha técnica de producto"])}`,
    /* --- 27001 --- */
    "27001-soa":(doc,sys)=>{
      const ctrls=[["A.5.1","Políticas de seguridad de la información","Aplicable"],["A.5.9","Inventario de activos","Aplicable"],["A.5.15","Control de acceso","Aplicable"],["A.5.24","Gestión de incidentes","Aplicable"],["A.6.3","Concienciación y formación","Aplicable"],["A.8.7","Protección frente a malware","Aplicable"],["A.8.16","Monitorización de actividades","Aplicable"],["A.8.24","Uso de criptografía","Según necesidad"]];
      return `<h2>Objeto</h2><p>Documentar los controles del Anexo A de ISO/IEC 27001:2022 aplicables al SGSI, su justificación y estado.</p>
      <p class="muted">El Anexo A contiene 93 controles en 4 dominios (Organizacionales, Personas, Físicos, Tecnológicos). A continuación un extracto; la SoA completa debe incluir los 93 controles.</p>
      <table><thead><tr><th>Control</th><th>Descripción</th><th>Aplicabilidad</th><th>Justificación</th></tr></thead><tbody>
      ${ctrls.map(c=>`<tr><td class="mono">${esc(c[0])}</td><td>${esc(c[1])}</td><td>${esc(c[2])}</td><td>Riesgo identificado / requisito</td></tr>`).join("")}
      </tbody></table>${refBlock(sys)}${recordsBlock(["Declaración de aplicabilidad completa"])}`;
    },
    "27001-eval":(doc,sys)=>`<h2>Objeto</h2><p>Establecer la metodología de apreciación de riesgos de seguridad de la información.</p>
      <h2>Metodología</h2><p>Sobre cada activo se valoran las amenazas y vulnerabilidades frente a la <b>confidencialidad</b>, <b>integridad</b> y <b>disponibilidad</b>. Riesgo = Probabilidad × Impacto.</p>
      <table><thead><tr><th>Activo</th><th>Amenaza</th><th>Prob.</th><th>Impacto</th><th>Riesgo</th></tr></thead><tbody>
      <tr><td>Servidores / cloud</td><td>Acceso no autorizado</td><td>Media</td><td>Alto</td><td>Alto</td></tr>
      <tr><td>Datos de clientes</td><td>Fuga de información</td><td>Media</td><td>Alto</td><td>Alto</td></tr>
      <tr><td>Puestos de trabajo</td><td>Malware</td><td>Alta</td><td>Medio</td><td>Alto</td></tr>
      </tbody></table>${refBlock(sys,["ISO/IEC 27005 — Gestión de riesgos de seguridad de la información"])}${recordsBlock(["Inventario de activos","Registro de apreciación de riesgos"])}`,
    /* --- 50001 --- */
    "50001-revision":(doc,sys)=>`<h2>Objeto</h2><p>Realizar la revisión energética para analizar los usos y consumos de energía e identificar los usos significativos de energía (USE).</p>
      <h2>Desarrollo</h2><ol><li>Analizar el uso y consumo de energía a partir de datos y mediciones.</li><li>Identificar las áreas de uso significativo de energía (USE).</li><li>Identificar oportunidades de mejora del desempeño energético.</li><li>Estimar el consumo futuro.</li></ol>
      <table><thead><tr><th>Uso de energía</th><th>Consumo estimado</th><th>¿USE?</th></tr></thead><tbody>
      <tr><td>Climatización / iluminación</td><td>A cuantificar</td><td>Sí/No</td></tr>
      <tr><td>Proceso productivo</td><td>A cuantificar</td><td>Sí/No</td></tr>
      </tbody></table>${refBlock(sys)}${recordsBlock(["Revisión energética","Listado de USE y oportunidades"])}`,
    /* --- 37001 --- */
    "37001-politica-as":(doc,sys)=>`<h2>Declaración de política antisoborno</h2><p>La Dirección de <b>${esc(sys.org)}</b> prohíbe el soborno en todas sus formas, tanto directo como indirecto, y se compromete a:</p>
      <ul><li>Cumplir la legislación antisoborno aplicable.</li><li>Prohibir y no tolerar el soborno activo o pasivo.</li><li>Fomentar el planteamiento de inquietudes de buena fe sin represalias.</li><li>Otorgar autoridad e independencia a la función de cumplimiento antisoborno.</li><li>Mejorar continuamente el sistema de gestión antisoborno.</li></ul>
      ${refBlock(sys)}${recordsBlock(["Evidencia de comunicación de la política","Compromisos firmados"])}`,
    "37001-denuncias":(doc,sys)=>`<h2>Objeto</h2><p>Establecer un canal para plantear inquietudes sobre soborno o incumplimientos, garantizando la confidencialidad y la ausencia de represalias.</p>
      <h2>Desarrollo</h2><ol><li>Canales disponibles (buzón, correo, plataforma) y su acceso.</li><li>Recepción y registro confidencial de la comunicación.</li><li>Evaluación y, en su caso, investigación.</li><li>Protección del denunciante de buena fe.</li><li>Comunicación del resultado cuando proceda.</li></ol>
      ${refBlock(sys)}${recordsBlock(["Registro de inquietudes planteadas","Informe de gestión del canal"])}`,
    /* --- 42001 --- */
    "42001-politica-ia":(doc,sys)=>`<h2>Declaración de política de IA</h2><p><b>${esc(sys.org)}</b> se compromete a un uso y desarrollo responsable de la inteligencia artificial conforme a los siguientes principios:</p>
      <ul><li><b>Transparencia y explicabilidad</b> de los sistemas de IA.</li><li><b>Equidad</b> y prevención de sesgos injustos.</li><li><b>Supervisión humana</b> apropiada.</li><li><b>Seguridad y robustez</b> de los sistemas.</li><li><b>Privacidad</b> y protección de datos.</li><li><b>Rendición de cuentas</b> sobre los resultados.</li></ul>
      ${refBlock(sys)}${recordsBlock(["Evidencia de comunicación de la política de IA"])}`,
    "42001-aia":(doc,sys)=>`<h2>Objeto</h2><p>Evaluar el impacto de los sistemas de IA sobre las personas y la sociedad (AIA — AI Impact Assessment).</p>
      <h2>Contenido de la evaluación</h2><ul><li>Descripción del sistema de IA y su finalidad.</li><li>Colectivos afectados y posibles perjuicios.</li><li>Riesgos de sesgo, discriminación y privacidad.</li><li>Medidas de mitigación y supervisión humana.</li><li>Impacto residual y decisión.</li></ul>
      <table><thead><tr><th>Sistema de IA</th><th>Finalidad</th><th>Riesgo principal</th><th>Mitigación</th></tr></thead><tbody>
      <tr><td>A completar</td><td>A completar</td><td>Sesgo / privacidad</td><td>Revisión humana, control de datos</td></tr></tbody></table>
      ${refBlock(sys)}${recordsBlock(["Evaluación de impacto por sistema de IA"])}`,
  };

  function haccpHazard(sys){
    return `<h2>Objeto</h2><p>Identificar los peligros para la inocuidad (biológicos, químicos, físicos y alérgenos) en cada etapa del proceso y determinar las medidas de control.</p>
      <h2>Análisis de peligros (Principio 1)</h2>
      <table><thead><tr><th>Etapa</th><th>Peligro</th><th>Tipo</th><th>Medida de control</th><th>¿Significativo?</th></tr></thead><tbody>
      ${sectorData(sys.sector).procesos.map(p=>`<tr><td>${esc(p.charAt(0).toUpperCase()+p.slice(1))}</td><td>Contaminación / desarrollo microbiano</td><td>Biológico</td><td>BPM / control de temperatura</td><td>A evaluar</td></tr>`).join("")}
      </tbody></table>

          ${s.headcount?`<span><b>Plantilla:</b> ${esc(s.headcount)}</span>`:""}

          <span><b>Documentos:</b> ${s.docs.length}</span>

        <div class="sc-foot" style="margin-top:14px"><div class="progressbar"><i style="width:${ps.pct}%"></i></div><span class="mono" style="color:var(--text-mid)">${ps.pct}% implantado (${ps.impl}/${ps.aplicables}) · ${aprob}/${s.docs.length} docs aprobados</span></div>
      </div>
      <div class="systabs">
        <button class="systab ${docsView?'on':''}" data-systab="docs">Documentación <span class="st-badge">${s.docs.length}</span></button>

      </div>
      ${body}
    `;
  }

  function planHTML(s){
    const ps=planStats(s);
    const byPhase={}; PLAN_PHASES.forEach(p=>byPhase[p.n]=[]);
    (s.tasks||[]).forEach(t=> (byPhase[t.phase]=byPhase[t.phase]||[]).push(t));
    const phases = PLAN_PHASES.filter(p=>byPhase[p.n] && byPhase[p.n].length).map(p=>{
      const list=byPhase[p.n];
      const impl=list.filter(t=>t.status==="Implantado").length;
      const na=list.filter(t=>t.status==="No aplica").length;
      const appl=list.length-na;
      const ppct=appl?Math.round(impl/appl*100):0;
      const rows=list.map(t=>{
        const kind=taskStatusKind(t.status);
        const docChip = t.docKey ? `<span class="task-doc" data-task-doc="${esc(t.docKey)}" title="Abrir documento">${esc((s.docs.find(d=>d.k===t.docKey)||{}).code||"DOC")}</span>` : "";
        const tncs = ncsForTask(s.id, t.k);
        const ncChip = tncs.length ? `<span class="task-ncbadge" data-tasknc="${esc(t.k)}" title="${tncs.length} no conformidad(es) vinculada(s)">⚠ ${tncs.length} NC</span>` : "";
        const normChips = (t.norms||[]).map(normChip).join("");
        return `<div class="task-row ${kind}">
          <span class="task-cl mono">${esc(t.cl)}</span>
          <div class="task-body"><div class="task-t">${esc(t.t)}</div><div class="task-meta">${normChips}${docChip}${ncChip}</div></div>
          <input class="task-inp task-resp" data-task-resp="${esc(t.k)}" value="${esc(t.responsible||"")}" placeholder="Responsable" />
          <input class="task-inp task-due" type="date" data-task-due="${esc(t.k)}" value="${esc(t.due||"")}" />
          <select class="task-status ${kind}" data-task-status="${esc(t.k)}">${TASK_STATUSES.map(o=>`<option ${o===t.status?"selected":""}>${o}</option>`).join("")}</select>
        </div>`;
      }).join("");
      return `<div class="plan-phase">
        <div class="ph-head"><div class="ph-title"><span class="ph-num">${p.n}</span> ${esc(p.t)}</div>
          <div class="ph-right"><div class="ph-bar"><i style="width:${ppct}%"></i></div><span class="mono">${impl}/${appl}</span></div></div>
        <div class="task-list">${rows}</div>
      </div>`;
    }).join("");
    return `
      <div class="plan-summary">
        <div class="ps-main"><div class="ps-pct mono">${ps.pct}%</div><div class="ps-cap"><b>implantado</b><span>${ps.impl} de ${ps.aplicables} requisitos aplicables</span></div></div>
        <div class="ps-legend">
          <span class="lg ok">${ps.impl} implantados</span>
          <span class="lg warn">${ps.curso} en curso</span>
          <span class="lg bad">${ps.noini} sin iniciar</span>
          <span class="lg susp">${ps.na} no aplica</span>
        </div>
      </div>
      ${phases}
      <div class="plan-note">El estado de cada requisito es tu análisis de brechas. Ajusta el estado, asigna un responsable y un plazo; el porcentaje de implantación se refleja en el Panel y en la ficha del sistema.</div>
    `;
  }

    document.querySelectorAll("#w-norms .normopt").forEach(l=>{

  function saveSystem(id){
    const norms = [...document.querySelectorAll("#w-norms input:checked")].map(c=>c.value);
    const get = (k)=>{ const el=document.getElementById("w-"+k); return el?el.value.trim():""; };
    let ok=true;
    document.querySelectorAll("#modalBody .field").forEach(f=>f.classList.remove("invalid"));
    if(!get("org")){ document.querySelector('[data-field="org"]').classList.add("invalid"); ok=false; }
    if(!get("scope")){ document.querySelector('[data-field="scope"]').classList.add("invalid"); ok=false; }
    const nerr=document.getElementById("w-norms-err"); nerr.style.display="none";
    if(!norms.length){ nerr.style.display="block"; ok=false; }
    if(!ok){ toast("Revisa los campos marcados","bad"); return; }

    const input = { id, org:get("org"), clientId:document.getElementById("w-clientId").value||null, sector:get("sector"),
      norms, scope:get("scope"), activities:get("activities"), sites:get("sites"), headcount:get("headcount"), responsible:get("responsible") };

    if(id){
      const s=getSystem(id);
      Object.assign(s, input, {updatedAt:stamp(), createdAt:s.createdAt});
      rebuildSystemDocs(s);
      rebuildSystemTasks(s);
      toast("Sistema actualizado");
    } else {
      const s=buildSystem(input);
      db.systems.push(s);
      openSystemId=s.id;
      toast("Sistema generado con "+s.docs.length+" documentos");
    }
    save(); closeModal(); render();
  }

  /* ---- Visor / editor de documento ---- */
  let docReaderState = null; // {sysId, docKey, editing}
  function openDocReader(sysId, docKey, editing){
    const s=getSystem(sysId); if(!s) return;
    const doc=s.docs.find(d=>d.k===docKey); if(!doc) return;
    docReaderState={sysId, docKey, editing:!!editing};
    document.getElementById("modalTitle").textContent = doc.code+" · "+doc.t;
    document.querySelector(".modal").classList.add("docreader");
    const body=document.getElementById("modalBody");
    if(editing){
      body.innerHTML = `
        <div class="doc-edit-toolbar" id="docToolbar">
          <button class="tbtn" data-cmd="formatBlock" data-val="h2" title="Título">H2</button>
          <button class="tbtn" data-cmd="formatBlock" data-val="h3" title="Subtítulo">H3</button>
          <button class="tbtn" data-cmd="formatBlock" data-val="p" title="Texto normal">¶</button>
          <span class="tsep"></span>
          <button class="tbtn" data-cmd="bold" title="Negrita"><b>B</b></button>
          <button class="tbtn" data-cmd="italic" title="Cursiva"><i>I</i></button>
          <button class="tbtn" data-cmd="underline" title="Subrayado"><u>U</u></button>
          <span class="tsep"></span>
          <button class="tbtn" data-cmd="insertUnorderedList" title="Lista con viñetas">• Lista</button>
          <button class="tbtn" data-cmd="insertOrderedList" title="Lista numerada">1. Lista</button>
          <span class="tsep"></span>
          <button class="tbtn" data-cmd="undo" title="Deshacer">↶</button>
          <button class="tbtn" data-cmd="redo" title="Rehacer">↷</button>
          <span style="margin-left:auto"></span>
          <button class="tbtn" id="toggleHtml" title="Ver / editar el código HTML">&lt;/&gt; HTML</button>
        </div>
        <div class="doc-paper doc-edit-rich" id="docRich" contenteditable="true">${docBody(doc,s)}</div>
        <textarea class="doc-edit-area" id="docEdit" style="display:none">${esc(docBody(doc,s))}</textarea>`;
      const rich=document.getElementById("docRich"), area=document.getElementById("docEdit");
      let htmlMode=false;
      document.querySelectorAll("#docToolbar .tbtn[data-cmd]").forEach(b=>{
        b.onmousedown=(e)=>e.preventDefault(); // conservar la selección
        b.onclick=()=>{ if(htmlMode) return; rich.focus(); document.execCommand(b.dataset.cmd,false,b.dataset.val||null); };
      });
      document.getElementById("toggleHtml").onclick=()=>{
        htmlMode=!htmlMode;
        if(htmlMode){ area.value=rich.innerHTML; area.style.display="block"; rich.style.display="none"; }
        else { rich.innerHTML=area.value; area.style.display="none"; rich.style.display="block"; }
      };
      // guardar helper accesible desde el pie
      openDocReader._getEdited = ()=> htmlMode ? area.value : rich.innerHTML;
    } else {
      body.innerHTML = `<div id="printRegion">${docFullHTML(doc,s)}</div>` + docExtraHTML(doc,s);
      body.querySelectorAll("[data-gotonc]").forEach(b=>b.onclick=()=>gotoNc(b.dataset.gotonc));
    }
    const foot=document.getElementById("modalFoot");
    if(editing){
      foot.innerHTML = `<button class="btn subtle" id="dCancel">Cancelar</button><button class="btn subtle" id="dReset">Restablecer</button><button class="btn" id="dSaveDoc">Guardar</button>`;
      document.getElementById("dCancel").onclick=()=>openDocReader(sysId,docKey,false);
      document.getElementById("dReset").onclick=()=>{ delete doc.custom; logDocHistory(doc,"Restablecido a plantilla"); save(); openDocReader(sysId,docKey,false); toast("Documento restablecido a la plantilla","warn"); };
      document.getElementById("dSaveDoc").onclick=()=>{ doc.custom=(openDocReader._getEdited?openDocReader._getEdited():document.getElementById("docEdit").value); logDocHistory(doc,"Contenido editado"); doc.updatedAt=stamp(); save(); openDocReader(sysId,docKey,false); toast("Cambios guardados"); };
    } else {
      foot.innerHTML = `<button class="btn subtle sm" id="dEdit">${iconEdit()} Editar</button>
        <button class="btn subtle sm" id="dNewVer">${iconArrow2()} Subir versión</button>
        <button class="btn subtle sm" id="dApprove">${iconCheck2()} Aprobar</button>
        <button class="btn subtle sm" id="dDownload">${iconDownload()} Descargar</button>
        <button class="btn sm" id="dPrint">${iconPrint()} Imprimir / PDF</button>`;
      document.getElementById("dEdit").onclick=()=>openDocReader(sysId,docKey,true);
      document.getElementById("dNewVer").onclick=()=>{
        const note=prompt("Describe brevemente el cambio de esta nueva versión:");
        if(note===null) return;
        doc.version=bumpVersion(doc.version); doc.status="En revisión";
        logDocHistory(doc,"Nueva versión", note);
        doc.updatedAt=stamp(); save(); openDocReader(sysId,docKey,false); toast("Nueva versión v"+doc.version+" · en revisión");
      };
      document.getElementById("dApprove").onclick=()=>{ doc.status="Aprobado"; logDocHistory(doc,"Aprobado"); doc.updatedAt=stamp(); save(); toast("Documento aprobado v"+doc.version); closeDocReader(); render(); };
      document.getElementById("dDownload").onclick=()=>downloadDoc(s,doc);
      document.getElementById("dPrint").onclick=()=>window.print();
    }
    openModal();
  }
  function docExtraHTML(doc, s){
    const hist = (doc.history||[]).slice().reverse();
    const histHTML = hist.length ? `<table class="mini-tbl"><thead><tr><th>Versión</th><th>Fecha</th><th>Acción</th></tr></thead><tbody>${hist.map(h=>`<tr><td class="mono">v${esc(h.v)}</td><td>${fmtDate((h.date||"").slice(0,10))}</td><td>${esc(h.action)}${h.note?` — <span class="muted">${esc(h.note)}</span>`:""}</td></tr>`).join("")}</tbody></table>` : `<div class="muted">Sin cambios registrados.</div>`;
    const ncs = ncsForDoc(s.id, doc.k);
    const ncHTML = ncs.length ? ncs.map(n=>{
      const sev=n.severity==="Mayor"?"bad":n.severity==="Menor"?"warn":"action";
      const stt=n.status==="Cerrada"?"ok":n.status==="En tratamiento"?"warn":"bad";
      return `<div class="dx-nc"><div style="flex:1;min-width:0"><div class="dx-nc-t">${pill(sev,n.severity)} ${pill(stt,n.status)}</div><div class="muted" style="margin-top:4px">${esc((n.description||"").slice(0,110))}</div></div><button class="btn subtle sm" data-gotonc="${n.id}">Ver NC</button></div>`;
    }).join("") : `<div class="muted">Ningún hallazgo vinculado a este documento.</div>`;
    return `<div class="doc-extra">
      <div class="dx-block"><h4>Historial de versiones</h4>${histHTML}</div>
      <div class="dx-block"><h4>No conformidades vinculadas ${ncs.length?`<span class="dx-badge">${ncs.length}</span>`:""}</h4>${ncHTML}</div>
    </div>`;
  }
  function closeDocReader(){ docReaderState=null; document.querySelector(".modal").classList.remove("docreader"); closeModal(); }

  function docStandaloneHTML(s, doc){

    th,td{border:1px solid #cdd7e6;padding:7px 9px;text-align:left;vertical-align:top}th{background:#eef3fa;color:#12335f}
    .doc-hd{display:flex;justify-content:space-between;border-bottom:2px solid #12335f;padding-bottom:10px;margin-bottom:6px}.org{text-align:right;font-size:11px;color:#5a6b86}
    .docmeta{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 20px;margin:14px 0;padding:12px 14px;background:#eef3fa;border-radius:8px;font-size:12px}
    .tag{display:inline-block;font-size:10.5px;background:#12335f;color:#fff;border-radius:5px;padding:2px 7px;margin:0 3px 3px 0}.muted{color:#5a6b86;font-size:11.5px}.mono{font-family:ui-monospace,monospace}
    blockquote{border-left:3px solid #12335f;margin:8px 0;padding:6px 14px;background:#eef3fa;border-radius:0 8px 8px 0}</style></head>
    <body>${docFullHTML(doc,s)}</body></html>`;
  }
  function downloadDoc(s, doc){
    const blob=new Blob([docStandaloneHTML(s,doc)],{type:"text/html;charset=utf-8"});
    downloadBlob(blob, (doc.code+"_"+doc.t).replace(/[^\w\-]+/g,"_").slice(0,60)+".html");
    toast("Documento descargado");
  }
  async function exportSystemZip(s){
    if(typeof JSZip==="undefined"){ toast("No se pudo cargar el compresor","bad"); return; }
    const zip=new JSZip();
    const root=zip.folder(("SGI_"+s.org).replace(/[^\w\-]+/g,"_").slice(0,50));
    const catFolder={};
    CAT_ORDER.forEach(c=>{ catFolder[c]=root.folder(String(CAT_ORDER.indexOf(c)+1).padStart(2,"0")+"_"+CAT_LABEL[c].replace(/[^\w\-]+/g,"_")); });
    let idx=`<!doctype html><meta charset="utf-8"><title>Índice — ${esc(s.org)}</title><body style="font-family:Inter,sans-serif;max-width:800px;margin:30px auto;color:#26324a"><h1>Sistema de Gestión — ${esc(s.org)}</h1><p>${s.norms.map(n=>esc(NORMS[n].code)).join(" · ")}</p><p><i>${esc(s.scope)}</i></p><h2>Índice documental</h2><table style="width:100%;border-collapse:collapse">`;
    s.docs.forEach(d=>{
      const html=docStandaloneHTML(s,d);
      const fname=(d.code+"_"+d.t).replace(/[^\w\-]+/g,"_").slice(0,60)+".html";
      catFolder[d.cat].file(fname, html);
      idx+=`<tr><td style="border:1px solid #cdd7e6;padding:6px" class="mono">${esc(d.code)}</td><td style="border:1px solid #cdd7e6;padding:6px">${esc(d.t)}</td><td style="border:1px solid #cdd7e6;padding:6px">${esc(d.status)}</td></tr>`;
    });
    idx+=`</table></body>`;
    root.file("00_Indice.html", idx);
    // Maestro de documentos (CSV)
    const csv="\uFEFF"+["Código,Documento,Categoría,Cláusula,Normas,Estado"].concat(s.docs.map(d=>`${d.code},"${d.t}",${CAT_LABEL[d.cat]},${d.cl},"${d.norms.map(n=>NORMS[n].code).join(' / ')}",${d.status}`)).join("\r\n");
    root.file("00_Maestro_de_documentos.csv", csv);
    // Plan de implantación / análisis de brechas (CSV)
    const ps=planStats(s);
    const planCsv="\uFEFF"+[`Plan de implantación — ${s.org} (${ps.pct}% implantado)`,"Capítulo,Cláusula,Requisito,Normas,Documento,Estado,Responsable,Plazo"]
      .concat((s.tasks||[]).map(t=>`${t.phase} ${PHASE_LABEL[t.phase]||""},${t.cl},"${t.t.replace(/"/g,"'")}","${(t.norms||[]).map(n=>NORMS[n].code).join(' / ')}",${t.docKey?((s.docs.find(d=>d.k===t.docKey)||{}).code||''):''},${t.status},"${t.responsible||''}",${t.due||''}`)).join("\r\n");
    root.file("00_Plan_de_implantacion.csv", planCsv);
    const blob=await zip.generateAsync({type:"blob"});
    downloadBlob(blob, ("SGI_"+s.org).replace(/[^\w\-]+/g,"_").slice(0,50)+"_"+new Date().toISOString().slice(0,10)+".zip");
    toast("Documentación exportada ("+s.docs.length+" documentos)");
  }

  /* ---- Wiring de la vista sistemas ---- */
  function wireSistemas(){
    const nb=document.getElementById("newSystemBtn"); if(nb) nb.onclick=()=>openSystemWizard(null);
    document.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{ openSystemId=el.dataset.open; sysTab="docs"; render(); });
    const back=document.getElementById("backSystems"); if(back) back.onclick=()=>{ openSystemId=null; sysTab="docs"; render(); };
    const es=document.getElementById("editSystemBtn"); if(es) es.onclick=()=>openSystemWizard(openSystemId);
    const ex=document.getElementById("exportSystemBtn"); if(ex) ex.onclick=()=>exportSystemZip(getSystem(openSystemId));
    const del=document.getElementById("deleteSystemBtn"); if(del) del.onclick=()=>deleteSystem(openSystemId);
    document.querySelectorAll("[data-systab]").forEach(b=>b.onclick=()=>{ sysTab=b.dataset.systab; render(); });
    document.querySelectorAll("[data-doc]").forEach(el=>el.onclick=()=>openDocReader(openSystemId, el.dataset.doc, false));
    document.querySelectorAll("[data-doc-status]").forEach(sel=>sel.onchange=()=>{
      const s=getSystem(openSystemId); const d=s.docs.find(x=>x.k===sel.dataset.docStatus);
      if(d){ d.status=sel.value; logDocHistory(d,"Estado: "+sel.value); d.updatedAt=stamp(); save(); render(); }
    });
    document.querySelectorAll("[data-tasknc]").forEach(el=>el.onclick=(e)=>{
      e.stopPropagation();
      const list=ncsForTask(openSystemId, el.dataset.tasknc);
      if(list.length===1) gotoNc(list[0].id); else go("ncs");
    });
    // --- Plan de implantación ---
    const findTask=(k)=>{ const s=getSystem(openSystemId); return s && (s.tasks||[]).find(t=>t.k===k); };
    document.querySelectorAll("[data-task-status]").forEach(sel=>sel.onchange=()=>{
      const t=findTask(sel.dataset.taskStatus); if(t){ t.status=sel.value; save(); render(); }
    });
    document.querySelectorAll("[data-task-resp]").forEach(inp=>inp.onchange=()=>{
      const t=findTask(inp.dataset.taskResp); if(t){ t.responsible=inp.value.trim(); save(); }
    });
    document.querySelectorAll("[data-task-due]").forEach(inp=>inp.onchange=()=>{
      const t=findTask(inp.dataset.taskDue); if(t){ t.due=inp.value; save(); }
    });
    document.querySelectorAll("[data-task-doc]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openDocReader(openSystemId, el.dataset.taskDoc, false); });
  }

  function iconDownload(){ return ic('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'); }
  function iconPrint(){ return ic('<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>'); }
  function iconCheck2(){ return ic('<polyline points="20 6 9 17 4 12"/>'); }
  function iconArrow2(){ return ic('<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>'); }


  /* ---------------- Boot ---------------- */
  document.getElementById("menu").addEventListener("click", e=>{ const b=e.target.closest(".navitem"); if(b) go(b.dataset.view); });
  document.getElementById("search").addEventListener("input", e=>{ query=e.target.value.trim().toLowerCase(); render(); });
  document.getElementById("modalClose").onclick = closeModal;
  document.getElementById("scrim").addEventListener("click", e=>{ if(e.target.id==="scrim") closeModal(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeModal(); document.getElementById("exportWrap").classList.remove("open"); } });
  const exportWrap = document.getElementById("exportWrap");
  document.getElementById("exportBtn").onclick = (e)=>{ e.stopPropagation(); exportWrap.classList.toggle("open"); };
  document.getElementById("exportXlsxBtn").onclick = ()=>{ exportWrap.classList.remove("open"); exportXLSX(); };
  document.getElementById("exportCsvBtn").onclick = ()=>{ exportWrap.classList.remove("open"); exportCSV(); };
  document.getElementById("exportJsonBtn").onclick = ()=>{ exportWrap.classList.remove("open"); exportJSON(); };
  document.getElementById("importJsonBtn").onclick = ()=>{ exportWrap.classList.remove("open"); document.getElementById("importFile").click(); };
  document.getElementById("importFile").onchange = (e)=>{ const f=e.target.files[0]; if(f) importBackup(f); e.target.value=""; };
  document.addEventListener("click", (e)=>{ if(!exportWrap.contains(e.target)) exportWrap.classList.remove("open"); });
  document.getElementById("resetBtn").onclick = resetAll;
  document.getElementById("cloudBtn").onclick = openCloudModal;
  startClock();
  const burger = document.getElementById("burger"), side=document.getElementById("side"), sbg=document.getElementById("scrimbg");
  burger.onclick = ()=>{ side.classList.toggle("open"); sbg.classList.toggle("open"); };
  sbg.onclick = ()=>{ side.classList.remove("open"); sbg.classList.remove("open"); };

  load().then(()=>{ render(); updateCloudStatus(); }).catch(()=>{ db=seed(); render(); updateCloudStatus(); });
})();
</script>
