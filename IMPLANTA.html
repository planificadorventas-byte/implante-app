<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IMPLANTA · Sistema de gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
  :root {
    --ink: #0a0f1c;
    --panel: #101828;
    --panel-2: #16203a; /* raised */
    --line: #223049;
    --line-soft: #1b2740;
    --text: #e7ecf5;
    --text-mid: #a4b1c7;
    --text-dim: #6f7e97;

    --action: #4f9dff;
    --action-ink: #071324;

    --ok: #33d69f;
    --warn: #f6b23f;
    --bad: #f06767;
    --susp: #7f8ca6;

    --ok-bg: rgba(51,214,159,.12);
    --warn-bg: rgba(246,178,63,.13);
    --bad-bg: rgba(240,103,103,.13);
    --susp-bg: rgba(127,140,166,.14);
    --action-bg: rgba(79,157,255,.12);

    --r: 10px;
    --r-lg: 14px;
    --shadow: 0 18px 40px -22px rgba(0,0,0,.75);

    --sans: "Inter", system-ui, sans-serif;
    --display: "Space Grotesk", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 82% -10%, rgba(79,157,255,.10), transparent 60%),
      radial-gradient(900px 500px at -5% 8%, rgba(51,214,159,.06), transparent 55%),
      var(--ink);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3 { font-family: var(--display); font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; font-size: 14px; }
  ::selection { background: rgba(79,157,255,.35); }

  /* ---------- App shell ---------- */
  .app { display: grid; grid-template-columns: 244px 1fr; min-height: 100vh; }

  .side {
    border-right: 1px solid var(--line-soft);
    background: linear-gradient(180deg, rgba(22,32,58,.55), rgba(16,24,40,.2));
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { padding: 20px 20px 14px; display: flex; align-items: center; gap: 11px; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto;
    background: linear-gradient(150deg, var(--action), #6d5cff);
    display: grid; place-items: center;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 8px 20px -8px rgba(79,157,255,.7);
  }
  .brand .mark svg { width: 19px; height: 19px; }
  .brand .name { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .02em; }
  .brand .sub { font-size: 11px; color: var(--text-dim); letter-spacing: .04em; margin-top: 1px; }

  nav.menu { padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .navitem {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px; border-radius: 9px;
    color: var(--text-mid); cursor: pointer; border: 0; background: transparent;
    text-align: left; width: 100%; font-size: 13.5px; font-weight: 500;
    transition: background .14s ease, color .14s ease;
  }
  .navitem svg { width: 17px; height: 17px; opacity: .85; flex: 0 0 auto; }
  .navitem .count {
    margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    background: var(--line-soft); padding: 1px 7px; border-radius: 20px;
  }
  .navitem:hover { background: rgba(255,255,255,.04); color: var(--text); }
  .navitem.active { background: var(--action-bg); color: var(--text); }
  .navitem.active svg { opacity: 1; color: var(--action); }
  .navitem.active .count { background: rgba(79,157,255,.2); color: #bcd8ff; }

  .side .foot { margin-top: auto; padding: 14px; border-top: 1px solid var(--line-soft); display: grid; gap: 8px; }
  .ghostbtn {
    display: flex; align-items: center; gap: 9px; justify-content: flex-start;
    padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--text-mid); cursor: pointer; font-size: 12.5px; font-weight: 500;
    transition: border-color .14s, color .14s;
  }
  .ghostbtn:hover { border-color: var(--action); color: var(--text); }
  .ghostbtn svg { width: 15px; height: 15px; }
  .ghostbtn .chev { margin-left: auto; width: 13px; height: 13px; transition: transform .14s ease; }
  .exportWrap { position: relative; }
  .exportWrap.open .ghostbtn .chev { transform: rotate(180deg); }
  .exportMenu {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 6px);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 5px; display: none; flex-direction: column; gap: 2px; z-index: 30;
  }
  .exportWrap.open .exportMenu { display: flex; }
  .exportOpt {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    background: transparent; border: 0; color: var(--text-mid); cursor: pointer;
    padding: 8px 9px; border-radius: 7px; font-size: 12.5px; font-weight: 500;
    transition: background .12s, color .12s;
  }
  .exportOpt:hover { background: rgba(255,255,255,.05); color: var(--text); }
  .exportOpt svg { width: 15px; height: 15px; flex: 0 0 auto; color: var(--action); }
  .exportOpt .fmt-ext { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); }
  .credit { text-align: center; font-size: 11px; color: var(--text-dim); letter-spacing: .02em; padding-top: 4px; }
  .credit b { color: var(--text-mid); font-weight: 600; }

  /* ---------- Main ---------- */
  main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 28px; border-bottom: 1px solid var(--line-soft);
    position: sticky; top: 0; z-index: 20;
    background: rgba(10,15,28,.72); backdrop-filter: blur(10px);
  }
  .burger { display: none; }
  .topbar .title { font-family: var(--display); font-size: 18px; font-weight: 600; }
  .topbar .crumb { color: var(--text-dim); font-size: 12.5px; margin-top: 1px; }
  .search {
    margin-left: auto; position: relative; width: min(320px, 40vw);
  }
  .search input {
    width: 100%; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 9px; padding: 9px 12px 9px 34px; outline: none;
    transition: border-color .14s;
  }
  .search input:focus { border-color: var(--action); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-dim); }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--action); color: var(--action-ink); border: 0; cursor: pointer;
    padding: 9px 14px; border-radius: 9px; font-weight: 600; font-size: 13px;
    box-shadow: 0 8px 18px -10px rgba(79,157,255,.9);
    transition: transform .1s ease, filter .14s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 15px; height: 15px; }
  .btn.sm { padding: 6px 10px; font-size: 12px; }
  .btn.subtle { background: var(--panel-2); color: var(--text); box-shadow: none; border: 1px solid var(--line); }
  .btn.danger { background: var(--bad-bg); color: #ffb4b4; box-shadow: none; border: 1px solid rgba(240,103,103,.35); }

  .view { padding: 24px 28px 60px; max-width: 1180px; width: 100%; }
  .view.hidden { display: none; }

  /* ---------- Dashboard hero ---------- */
  .hero {
    border: 1px solid var(--line); border-radius: var(--r-lg);
    background:
      linear-gradient(180deg, rgba(22,32,58,.6), rgba(16,24,40,.35)),
      repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 44px);
    padding: 22px 24px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center;
    position: relative; overflow: hidden; box-shadow: var(--shadow);
  }
  .hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(500px 200px at 88% 0%, rgba(79,157,255,.14), transparent 70%);
  }
  .hero .eyebrow { color: var(--text-dim); font-size: 12px; margin-bottom: 8px; }
  .hero .big { display: flex; align-items: baseline; gap: 12px; }
  .hero .big .num { font-family: var(--mono); font-weight: 600; font-size: 52px; line-height: 1; letter-spacing: -.03em; }
  .hero .big .num.alarm { color: var(--warn); }
  .hero .big .cap { color: var(--text-mid); font-size: 14px; max-width: 260px; }
  .pulse {
    width: 118px; height: 118px; border-radius: 50%; display: grid; place-items: center; position: relative; z-index: 1;
    background: conic-gradient(var(--gauge, var(--ok)) var(--deg, 300deg), rgba(255,255,255,.06) 0);
  }
  .pulse::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); }
  .pulse .val { position: relative; text-align: center; }
  .pulse .val b { font-family: var(--mono); font-size: 24px; }
  .pulse .val span { display: block; font-size: 10px; color: var(--text-dim); }

  /* ---------- KPI grid ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-top: 16px; }
  .kpi {
    border: 1px solid var(--line); border-radius: var(--r); background: var(--panel);
    padding: 15px 16px; position: relative; overflow: hidden;
  }
  .kpi .k-top { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 12px; }
  .kpi .k-top svg { width: 15px; height: 15px; }
  .kpi .k-num { font-family: var(--mono); font-size: 30px; font-weight: 600; margin-top: 8px; letter-spacing: -.02em; }
  .kpi .k-note { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .kpi .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }

  .grid2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; margin-top: 16px; }

  .card {
    border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel);
    overflow: hidden;
  }
  .card .c-head {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft);
  }
  .card .c-head h3 { font-size: 14.5px; }
  .card .c-head .hint { color: var(--text-dim); font-size: 12px; margin-left: auto; }
  .card .c-body { padding: 6px 6px 8px; }

  .row {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
    padding: 10px 12px; border-radius: 9px;
  }
  .row:hover { background: rgba(255,255,255,.03); }
  .row .r-main { min-width: 0; }
  .row .r-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .r-sub { color: var(--text-dim); font-size: 12px; margin-top: 1px; }
  .row .r-sub .mono { color: var(--text-mid); }

  /* ---------- Pills ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 20px;
    font-size: 11.5px; font-weight: 600; white-space: nowrap; border: 1px solid transparent;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .pill.ok { background: var(--ok-bg); color: #8ff0d0; border-color: rgba(51,214,159,.25); }
  .pill.ok .dot { background: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: #ffd591; border-color: rgba(246,178,63,.28); }
  .pill.warn .dot { background: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: #ffb0b0; border-color: rgba(240,103,103,.3); }
  .pill.bad .dot { background: var(--bad); }
  .pill.susp { background: var(--susp-bg); color: #c3cbdb; border-color: rgba(127,140,166,.3); }
  .pill.susp .dot { background: var(--susp); }
  .pill.action { background: var(--action-bg); color: #bcd8ff; border-color: rgba(79,157,255,.3); }
  .pill.action .dot { background: var(--action); }
  .pill.prog { background: var(--action-bg); color: #bcd8ff; border-color: rgba(79,157,255,.3); }
  .pill.prog .dot { background: var(--action); }
  .pill.plan { background: var(--susp-bg); color: #c3cbdb; border-color: rgba(127,140,166,.3); }
  .pill.plan .dot { background: var(--susp); }

  .std-tag {
    font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 2px 7px;
    border-radius: 6px; background: var(--line-soft); color: var(--text-mid); border: 1px solid var(--line);
  }

  /* ---------- Table ---------- */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .segs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); padding: 4px; border-radius: 10px; }
  .seg { border: 0; background: transparent; color: var(--text-mid); padding: 6px 11px; border-radius: 7px; cursor: pointer; font-size: 12.5px; font-weight: 500; }
  .seg.active { background: var(--panel-2); color: var(--text); }
  .toolbar .spacer { margin-left: auto; }

  .tablewrap { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-weight: 500; font-size: 11.5px; color: var(--text-dim);
    padding: 11px 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.015);
    position: sticky; top: 0;
  }
  tbody td { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: rgba(255,255,255,.025); }
  td .cell-title { font-weight: 500; }
  td .cell-sub { color: var(--text-dim); font-size: 12px; }
  .rowbtns { display: flex; gap: 6px; justify-content: flex-end; }
  .iconbtn {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent;
    color: var(--text-mid); cursor: pointer; display: grid; place-items: center; transition: all .12s;
  }
  .iconbtn svg { width: 15px; height: 15px; }
  .iconbtn:hover { border-color: var(--action); color: var(--text); }
  .iconbtn.del:hover { border-color: var(--bad); color: #ffb0b0; }

  .empty { padding: 46px 20px; text-align: center; color: var(--text-dim); }
  .empty svg { width: 34px; height: 34px; opacity: .5; margin-bottom: 10px; }
  .empty p { margin: 0 0 4px; }

  /* ---------- Modal ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(4,7,14,.62); backdrop-filter: blur(3px);
    display: none; align-items: flex-start; justify-content: center; padding: 6vh 18px; z-index: 60; overflow: auto;
  }
  .scrim.open { display: flex; }
  .modal {
    width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
    animation: pop .16s ease;
  }
  @keyframes pop { from { transform: translateY(8px) scale(.99); opacity: 0; } }
  .modal .m-head { display: flex; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line-soft); }
  .modal .m-head h3 { font-size: 16px; }
  .modal .m-head .x { margin-left: auto; }
  .modal .m-body { padding: 16px 18px; display: grid; gap: 13px; max-height: 66vh; overflow: auto; }
  .modal .m-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--line-soft); }

  .field { display: grid; gap: 6px; }
  .field.half { }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  label { font-size: 12px; color: var(--text-mid); font-weight: 500; }
  .field input, .field select, .field textarea {
    background: var(--ink); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 9px 11px; outline: none; width: 100%; transition: border-color .14s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--action); }
  .field textarea { resize: vertical; min-height: 68px; }
  .field .err { color: #ffb0b0; font-size: 11.5px; display: none; }
  .field.invalid input, .field.invalid select { border-color: var(--bad); }
  .field.invalid .err { display: block; }

  /* ---------- Toast ---------- */
  .toasts { position: fixed; bottom: 22px; right: 22px; display: grid; gap: 10px; z-index: 80; }
  .toast {
    background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--ok);
    padding: 11px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 13px; max-width: 320px;
    animation: slidein .2s ease;
  }
  @keyframes slidein { from { transform: translateX(12px); opacity: 0; } }

  .loading { display: grid; place-items: center; min-height: 60vh; color: var(--text-dim); gap: 12px; }
  .spin { width: 26px; height: 26px; border: 2px solid var(--line); border-top-color: var(--action); border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  .trace { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 12px; color: var(--text-dim); }
  .trace .step { color: var(--text-mid); }
  .trace .nclink { color:#bcd8ff; background:var(--action-bg); border:1px solid rgba(79,157,255,.3); padding:1px 8px; border-radius:6px; cursor:pointer; font-family:var(--mono); font-size:11px; }
  .trace .nclink:hover { filter:brightness(1.15); }
  .doc-ver { font-size:10.5px; color:var(--text-dim); background:var(--line-soft); padding:1px 6px; border-radius:5px; }
  .doc-ncbadge { font-size:10px; font-weight:700; color:#ffb0b0; background:var(--bad-bg); border:1px solid rgba(240,103,103,.3); padding:1px 6px; border-radius:5px; }
  .task-ncbadge { font-size:10px; font-weight:700; color:#ffb0b0; background:var(--bad-bg); border:1px solid rgba(240,103,103,.3); padding:1px 7px; border-radius:6px; cursor:pointer; }
  .task-ncbadge:hover { filter:brightness(1.12); }
  .doc-extra { margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:720px){ .doc-extra { grid-template-columns:1fr; } }
  .dx-block { border:1px solid var(--line); border-radius:var(--r-lg); background:var(--panel); padding:14px 16px; }
  .dx-block h4 { margin:0 0 10px; font-size:13px; color:var(--text); display:flex; align-items:center; gap:8px; }
  .dx-badge { font-size:10.5px; font-weight:700; color:#ffb0b0; background:var(--bad-bg); border:1px solid rgba(240,103,103,.3); padding:1px 7px; border-radius:20px; }
  .mini-tbl { width:100%; border-collapse:collapse; font-size:12px; }
  .mini-tbl th, .mini-tbl td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  .mini-tbl th { color:var(--text-dim); font-weight:600; font-size:11px; }
  .dx-block .muted { color:var(--text-dim); font-size:12px; }
  .dx-nc { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft); }
  .dx-nc:last-child { border-bottom:0; }
  .dx-nc-t { display:flex; gap:6px; flex-wrap:wrap; }

  /* --- Sincronización en la nube --- */
  .cloud-dot { width:8px; height:8px; border-radius:50%; background:var(--text-dim); margin-left:auto; flex:0 0 auto; }
  .cloud-dot.on { background:var(--ok); box-shadow:0 0 0 3px rgba(51,214,159,.18); }
  .cloud-intro { font-size:13px; color:var(--text-mid); line-height:1.5; margin:0 0 14px; }
  .cloud-check { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-mid); margin:4px 0 12px; cursor:pointer; }
  .cloud-check input { width:16px; height:16px; }
  .cloud-status { font-size:12px; color:var(--text-dim); background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:9px 12px; margin-bottom:12px; }
  .cloud-status .cloud-ok { color:var(--ok); font-weight:600; }
  .cloud-status .cloud-off { color:var(--text-dim); font-weight:600; }
  .linklike { background:none; border:0; color:var(--action); font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; padding:4px 0; }
  .cloud-help { border-top:1px solid var(--line); margin-top:10px; padding-top:12px; font-size:12.5px; color:var(--text-mid); }
  .cloud-help ol { margin:0 0 10px; padding-left:20px; line-height:1.7; }
  .cloud-help li { margin-bottom:2px; }
  .codewrap { position:relative; margin:8px 0 12px; }
  .codewrap #copyCode { position:absolute; top:8px; right:8px; }
  .cloud-help pre { background:#0d1524; border:1px solid var(--line); border-radius:10px; padding:14px 16px; overflow:auto; font-family:var(--mono); font-size:11.5px; line-height:1.5; color:#cdd8ee; max-height:230px; margin:0; }
  .cloud-help .muted { color:var(--text-dim); font-size:11.5px; line-height:1.5; }

  /* --- Editor visual de documentos --- */

  /* --- Agenda del panel --- */

<script>
(function () {
  "use strict";

  const KEY = "atesta:db:v1";
  const EXPIRING_DAYS = 90;
  // URL fija de tu Apps Script: así, aunque el navegador no recuerde la
  // configuración entre sesiones, la app siempre sabe a qué archivo de
  // Google Drive conectarse y sincroniza sola al abrir.
  const DEFAULT_CLOUD_URL = "https://script.google.com/macros/s/AKfycbxeJAD7is71yYT4ewU5spGSyxxui1lp_xBt6IYNDLepxQ0s-PmbwAMDvmmYI7mH2FiV/exec";

  /* ---------------- Almacenamiento local robusto ----------------
     window.storage sólo existe dentro del entorno de Claude. Si el archivo
     se abre normalmente en el navegador (doble clic, hosting propio, etc.)
     no existe, así que usamos localStorage como almacenamiento real y,
     si además está disponible window.storage, lo usamos también como respaldo. */
  const localOk = (function(){ try{ const t="__t__"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t); return true; }catch(e){ return false; } })();
  async function storageGet(key){
    if (localOk) { const v = window.localStorage.getItem(key); if (v!=null) return { value: v }; }
    if (window.storage && window.storage.get) { try{ return await window.storage.get(key); }catch(e){} }
    return null;
  }
  async function storageSet(key, value){
    if (localOk) { try{ window.localStorage.setItem(key, value); }catch(e){} }
    if (window.storage && window.storage.set) { try{ await window.storage.set(key, value); }catch(e){} }
  }

  const STANDARDS = ["ISO 9001", "ISO 14001", "ISO 45001", "ISO 22000", "ISO 27001", "ISO 42001", "ISO 37001", "ISO 50001", "HACCP (Codex)", "ISO 13485", "ISO/IEC 17025"];
  const AUDIT_TYPES = ["Inicial (Fase 1)", "Inicial (Fase 2)", "Seguimiento", "Recertificación", "Especial"];
  const AUDIT_RESULTS = ["Favorable", "Condicionado", "No favorable", "Pendiente"];
  const NC_SEV = ["Mayor", "Menor", "Observación"];
  const NC_STATUS = ["Abierta", "En tratamiento", "Cerrada"];
  const DOC_TYPES = ["Manual", "Procedimiento", "Registro", "Plan de auditoría", "Informe", "Evidencia"];
  const DOC_STATUS = ["Borrador", "En revisión", "Aprobado", "Obsoleto"];

  let db = null;
  let current = "dashboard";
  let query = "";
  let filters = { certificados: "todos", ncs: "todos", auditorias: "todos" };
  let agendaFilter = { type: "todos", system: "todos" };
  let agendaReminder = 7; // días de antelación del recordatorio en el .ics (0 = sin recordatorio)

  /* ---------------- Storage ---------------- */
  async function load() {
    try {
      const res = await storageGet(KEY);
      if (res && res.value) db = JSON.parse(res.value);
    } catch (e) { db = null; }
    if (!db) db = seed();
    if (!Array.isArray(db.systems)) db.systems = [];
    if (!db._sync) db._sync = {url:"",auto:false,last:""};
    // Forzamos la URL fija y la sincronización automática, ya que el
    // navegador no está conservando esta configuración entre sesiones.
    if (!db._sync.url) db._sync.url = DEFAULT_CLOUD_URL;
    db._sync.auto = true;
    db.systems.forEach(s=>{
      if(!Array.isArray(s.tasks)) s.tasks = buildTaskSet(s.norms, s.docs);
      (s.docs||[]).forEach(d=>{ if(!Array.isArray(d.history)) d.history=[{v:d.version||"1.0", date:d.updatedAt||stamp(), action:"Documento generado", note:""}]; });
      ensureModules(s);
    });
    reconcileStatuses();
    // Si hay sincronización automática configurada, refresca con la última versión de la nube al abrir
    if (db._sync && db._sync.auto && db._sync.url) {
      try { await cloudPull(true); } catch(e) {}
    }
  }
  async function save() {
    try { await storageSet(KEY, JSON.stringify(db)); }
    catch (e) { toast("No se pudieron guardar los cambios", "bad"); }
    if (db._sync && db._sync.auto && db._sync.url) scheduleCloud();
  }

  /* ---------------- Sincronización en la nube ---------------- */
  let cloudTimer = null;
  function scheduleCloud(){ if(cloudTimer) clearTimeout(cloudTimer); cloudTimer=setTimeout(()=>{ cloudTimer=null; cloudPush(true); }, 1200); }
  function cloudPayload(){ const p=Object.assign({}, db); delete p._sync; return JSON.stringify(p); }
  // Envío de emergencia al cerrar/salir de la página: si hay un cambio pendiente
  // de subir (o aunque no lo haya, por seguridad), lo manda de inmediato con
  // sendBeacon, que sí se ejecuta aunque la pestaña se esté cerrando.
  function flushCloudOnExit(){
    try{
      if (!(db && db._sync && db._sync.auto && db._sync.url)) return;
      const body = cloudPayload();
      const blob = new Blob([body], {type:"text/plain;charset=utf-8"});
      if (navigator.sendBeacon) navigator.sendBeacon(db._sync.url, blob);
    }catch(e){}
  }
  window.addEventListener("pagehide", flushCloudOnExit);
  window.addEventListener("beforeunload", flushCloudOnExit);
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") flushCloudOnExit(); });
  async function cloudPush(silent){
    const url=(db._sync&&db._sync.url||"").trim();
    if(!url){ if(!silent) toast("Configura primero la URL de sincronización","warn"); return false; }
    const body=cloudPayload(); let ok=true, msg="Datos guardados en la nube";
    try{
      await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
    }catch(e){
      try{ await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body}); msg="Enviado a la nube (sin confirmación del servidor)"; }
      catch(e2){ ok=false; }
    }
    if(ok){ db._sync.last=stamp(); try{ await window.storage.set(KEY, JSON.stringify(db)); }catch(_){} updateCloudStatus(); if(!silent) toast(msg); }
    else if(!silent) toast("No se pudo conectar con la nube. Revisa la URL y los permisos.","bad");
    return ok;
  }
  async function cloudPull(silent){
    const url=(db._sync&&db._sync.url||"").trim();
    if(!url){ if(!silent) toast("Configura primero la URL de sincronización","warn"); return; }
    let data;
    try{ const res=await fetch(url,{method:"GET"}); data=JSON.parse(await res.text()); }
    catch(e){ if(!silent) toast("No se pudo cargar de la nube. Revisa la URL y los permisos.","bad"); return; }
    const valid = data && typeof data==="object" && ["clients","certificates","audits","nonconformities","documents"].every(k=>Array.isArray(data[k]));
    if(!valid){ if(!silent) toast("La nube no contiene datos válidos de IMPLANTA","bad"); return; }
    if(!silent && !confirm("Se reemplazarán los datos de este equipo por los de la nube. ¿Continuar?")) return;
    const keepSync = db._sync;
    db = { clients:data.clients, certificates:data.certificates, audits:data.audits, nonconformities:data.nonconformities, documents:data.documents, systems:Array.isArray(data.systems)?data.systems:[], _sync:keepSync };
    db.systems.forEach(s=>{ if(!Array.isArray(s.tasks)) s.tasks=buildTaskSet(s.norms, s.docs); (s.docs||[]).forEach(d=>{ if(!Array.isArray(d.history)) d.history=[{v:d.version||"1.0", date:stamp(), action:"Documento generado", note:""}]; }); ensureModules(s); });
    reconcileStatuses(); db._sync.last=stamp();
    openSystemId=null; sysTab="docs"; current="dashboard";
    save(); render(); if(!silent){ closeModal(); toast("Datos cargados de la nube"); }
    updateCloudStatus();
  }
  function updateCloudStatus(){
    const dot=document.getElementById("cloudDot");
    const connected=!!(db._sync&&db._sync.url);
    if(dot) dot.className="cloud-dot"+(connected?" on":"");
    const st=document.getElementById("cloudStatus");
    if(st){
      st.innerHTML = connected
        ? `<span class="cloud-ok">● Nube configurada</span>${db._sync.last?` · última sincronización: ${fmtDateTime(db._sync.last)}`:" · aún sin sincronizar"}${db._sync.auto?" · guardado automático activo":""}`
        : `<span class="cloud-off">● Sin configurar</span> — pega una URL para empezar.`;
    }
  }
  function fmtDateTime(s){ const d=new Date(s); if(isNaN(d)) return "—"; return d.toLocaleString("es-ES",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }

  /* ---------------- Reloj de cabecera ---------------- */
  function startClock(){
    const t=document.getElementById("clkTime"), d=document.getElementById("clkDate");
    const upd=()=>{
      const now=new Date();
      const time=now.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
      const s2=String(now.getSeconds()).padStart(2,"0");
      let date=now.toLocaleDateString("es-ES",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
      date=date.charAt(0).toUpperCase()+date.slice(1);
      if(t) t.innerHTML=esc(time)+'<span class="clk-sec">'+s2+'</span>';
      if(d) d.textContent=date;
    };
    upd(); setInterval(upd,1000);
  }

  /* ---------------- Consultor IA (asistente virtual) ---------------- */
  let aiChat = [];
  let aiBusy = false;
  let aiSystemId = null; // null=auto (sistema abierto o primero), "all"=todos, o un id de sistema
  const AI_SUGGESTIONS = [
    "¿Por dónde empiezo la implantación de mi sistema?",
    "¿Qué documentos me faltan por aprobar?",
    "¿Qué riesgos altos tengo y cómo van mis KPIs?",
    "¿Qué proveedores no son aptos o están condicionados?",
    "¿Qué brechas de competencia debo cubrir con formación?",
    "Explícame la cláusula 6.1 (riesgos y oportunidades)",
  ];
  function aiSelectedSystem(){
    const syss=db.systems||[];
    if(aiSystemId==="all") return {all:true, systems:syss};
    const s = getSystem(aiSystemId) || getSystem(openSystemId) || syss[0] || null;
    return {all:false, system:s};
  }
  // Resumen en texto plano de los módulos de gestión, para el contexto de los proveedores de IA externos
  function aiModuleContext(s){
    const L=[];
    const risks=s.risks||[];
    if(risks.length){
      const nivel=r=>(+r.prob)*(+r.imp);
      const altos=risks.filter(r=>r.tipo!=="Oportunidad"&&nivel(r)>=8);
      L.push(`RIESGOS Y OPORTUNIDADES (6.1): ${risks.length} registrados${altos.length?`, ${altos.length} de nivel Alto/Crítico`:""}.`);
      risks.slice(0,12).forEach(r=>L.push(`- [${r.tipo}] ${(r.desc||"(sin desc)").slice(0,90)} | proceso: ${r.proceso||"—"} | nivel: ${r.tipo==="Oportunidad"?"oportunidad":nivel(r)} | estado: ${r.estado||"—"}`));
    }
    const f=s.foda;
    if(f&&(f.f||f.o||f.d||f.a)) L.push(`CONTEXTO FODA (4.1) — Fortalezas: ${f.f||"—"} | Oportunidades: ${f.o||"—"} | Debilidades: ${f.d||"—"} | Amenazas: ${f.a||"—"}`);
    const kpis=s.kpis||[];
    if(kpis.length){
      const fuera=kpis.filter(k=>kpiStatus(k).cls==="bad").length;
      L.push(`OBJETIVOS/KPIs (6.2/9.1): ${kpis.length} indicadores${fuera?`, ${fuera} por debajo de la meta`:""}.`);
      kpis.forEach(k=>{ const last=kpiLast(k); L.push(`- ${k.nombre||"(sin nombre)"} (${k.proceso||"—"}): último ${last?last.valor:"—"} ${k.unidad||""} | meta ${k.sentido||"≥"} ${k.meta==null?"—":k.meta} | ${kpiStatus(k).t}`); });
    }
    const sup=s.suppliers||[];
    if(sup.length){
      L.push(`PROVEEDORES (8.4): ${sup.length} evaluados.`);
      sup.forEach(v=>{ const sc=supScore(v); L.push(`- ${v.nombre||"(sin nombre)"} | ${v.tipo}${v.critico?" (crítico)":""} | puntuación ${sc}/100 | ${supStatus(sc).t}`); });
    }
    const comps=s.comps||[];
    if(comps.length){
      const gaps=comps.filter(c=>(+c.requerido)-(+c.actual)>0);
      L.push(`COMPETENCIAS (7.2): ${comps.length} registros, ${gaps.length} con brecha.`);
      gaps.slice(0,10).forEach(c=>L.push(`- brecha: ${c.puesto||"—"} / ${c.competencia||"—"} (requerido ${c.requerido} vs actual ${c.actual})`));
    }
    const trs=s.trainings||[];
    if(trs.length){ const real=trs.filter(t=>t.estado==="Realizada").length; L.push(`FORMACIÓN (7.2): ${trs.length} acciones (${real} realizadas).`); }
    const eq=s.equipment||[];
    if(eq.length){ const venc=eq.filter(e=>{ const d=equipDue(e); return d.d!=null&&d.d<0; }).length; L.push(`EQUIPOS Y MANTENIMIENTO (7.1.5): ${eq.length} equipos${venc?`, ${venc} con mantenimiento/calibración vencidos`:""}.`); eq.slice(0,10).forEach(e=>{ const d=equipDue(e); L.push(`- ${e.codigo?e.codigo+" ":""}${e.nombre||"(sin nombre)"} | ${e.actividad||"—"} | próximo ${e.proximo||"—"} (${d.t}) | ${e.estado||"—"}`); }); }
    const revs=s.reviews||[];
    if(revs.length) L.push(`REVISIÓN POR LA DIRECCIÓN (9.3): ${revs.length} acta(s); última el ${fmtDate(revs[0].fecha)}.`);
    const leg=s.legal||[];
    if(leg.length){ const nc=leg.filter(e=>e.estado==="No cumple").length, pend=leg.filter(e=>e.estado==="Pendiente de evaluar").length; L.push(`CUMPLIMIENTO LEGAL (6.1.3): ${leg.length} requisitos${nc?`, ${nc} en incumplimiento`:""}${pend?`, ${pend} pendientes de evaluar`:""}.`); leg.slice(0,12).forEach(e=>L.push(`- ${(e.requisito||"(sin desc)").slice(0,90)}${e.referencia?" ("+e.referencia+")":""} | ${e.tipo||"—"} | ${e.estado||"—"}`)); }
    return L.length?`\n\nMÓDULOS DE GESTIÓN:\n${L.join("\n")}`:"";
  }
  function buildAiContext(){
    const sel=aiSelectedSystem();
    if(sel.all){
      const syss=sel.systems;
      if(!syss.length) return "La organización aún no ha creado ningún sistema de gestión.";
      const blocks=syss.map(s=>{ const p=planStats(s); const ap=s.docs.filter(d=>d.status==="Aprobado").length;
        return `• ${s.org} — Normas: ${s.norms.map(n=>NORMS[n]?NORMS[n].code:n).join(", ")} | Sector: ${s.sector} | Alcance: ${(s.scope||"(sin definir)").slice(0,120)} | Implantación: ${p.pct}% (${p.impl}/${p.aplicables}) | Docs aprobados: ${ap}/${s.docs.length}`;
      }).join("\n");
      const ncOpen=db.nonconformities.filter(n=>n.status!=="Cerrada");
      const ncLines=ncOpen.length?ncOpen.map(n=>`- ${n.severity} (${n.standard||""}) ${clientName(n.clientId)}: ${(n.description||"").slice(0,80)}`).join("\n"):"Ninguna abierta.";
      return `La organización gestiona ${syss.length} sistemas de gestión. Resumen de cada uno:\n${blocks}\n\nNO CONFORMIDADES ABIERTAS (todas):\n${ncLines}`;
    }
    const s = sel.system;
    if(!s) return "La organización aún no ha creado ningún sistema de gestión en la aplicación. Ofrece orientación general sobre implantación de sistemas ISO.";
    const p = planStats(s);
    const docLines = s.docs.map(d=>`- ${d.code} ${d.t} [${d.status}]`).join("\n");
    const ncOpen = db.nonconformities.filter(n=>n.status!=="Cerrada" && (!n.systemId || n.systemId===s.id));
    const ncLines = ncOpen.length ? ncOpen.map(n=>`- ${n.severity} (${n.standard||""}) cláusula ${n.clause||"—"}: ${(n.description||"").slice(0,90)}`).join("\n") : "Ninguna abierta.";
    return `Organización: ${s.org}
Sector: ${s.sector}
Normas del sistema: ${s.norms.map(n=>NORMS[n]?NORMS[n].code:n).join(", ")}
Alcance: ${s.scope||"(sin definir)"}
Actividades: ${s.activities||"(sin definir)"}
Emplazamientos: ${s.sites||"—"} · Plantilla: ${s.headcount||"—"}
Avance de implantación: ${p.pct}% (${p.impl}/${p.aplicables} requisitos implantados)
Documentos aprobados: ${s.docs.filter(d=>d.status==="Aprobado").length}/${s.docs.length}

DOCUMENTOS DEL SISTEMA:
${docLines}

NO CONFORMIDADES ABIERTAS:
${ncLines}${aiModuleContext(s)}`;
  }
  const AI_PROVIDERS = {
    local:     { name:"Asistente local (sin conexión)", free:true, local:true, model:"", keyUrl:"", note:"Responde con la información de TU sistema guardada en el archivo, sin conexión ni clave. Ideal si los proveedores externos no funcionan." },
    anthropic: { name:"Claude (Anthropic)", free:false, model:"claude-sonnet-4-6", keyUrl:"https://console.anthropic.com/settings/keys", note:"Funciona dentro de Claude sin clave. Fuera de Claude requiere una clave (de pago)." },
    gemini:    { name:"Google Gemini", free:true, model:"gemini-1.5-flash", keyUrl:"https://aistudio.google.com/apikey", note:"Gratis. Crea la clave en Google AI Studio (gratuita, sin tarjeta)." },
    mistral:   { name:"Mistral AI", free:true, model:"mistral-small-latest", keyUrl:"https://console.mistral.ai/api-keys", note:"Tiene plan gratuito. Crea la clave en console.mistral.ai." },
    openrouter:{ name:"OpenRouter (modelos gratis)", free:true, model:"meta-llama/llama-3.3-70b-instruct:free", keyUrl:"https://openrouter.ai/keys", note:"Ofrece modelos «:free». Crea la clave en openrouter.ai/keys." },
    groq:      { name:"Groq (Llama)", free:true, model:"llama-3.3-70b-versatile", keyUrl:"https://console.groq.com/keys", note:"Gratis y muy rápido. Crea la clave en console.groq.com." },
  };
  function aiCfg(){
    if(!db._ai) db._ai={};
    if(!db._ai.keys){ db._ai.keys = db._ai.key ? {anthropic:db._ai.key} : {}; }
    if(!db._ai.provider) db._ai.provider="anthropic";
    if(db._ai.model==null) db._ai.model="";
    return db._ai;
  }
  const CLAUSE_INFO = {
    "4":"Contexto de la organización: comprender la organización y su contexto, las necesidades de las partes interesadas, determinar el alcance y establecer el sistema y sus procesos.",
    "4.1":"Comprensión de la organización y su contexto: determinar las cuestiones internas y externas relevantes (por ejemplo, mediante un análisis FODA).",
    "4.2":"Comprensión de las necesidades y expectativas de las partes interesadas.",
    "4.3":"Determinación del alcance del sistema de gestión.",
    "4.4":"El sistema de gestión y sus procesos: identificar los procesos, su secuencia e interacción (mapa de procesos).",
    "5":"Liderazgo: compromiso de la alta dirección, política y asignación de roles.",
    "5.1":"Liderazgo y compromiso de la alta dirección con el sistema.",
    "5.2":"Política: establecer, comunicar y mantener la política del sistema.",
    "5.3":"Roles, responsabilidades y autoridades en la organización.",
    "6":"Planificación: abordar riesgos y oportunidades, fijar objetivos y planificar los cambios.",
    "6.1":"Acciones para abordar riesgos y oportunidades (en ISO 14001 incluye aspectos ambientales; en 45001, peligros de SST).",
    "6.2":"Objetivos del sistema y planificación para lograrlos.",
    "7":"Apoyo: recursos, competencia, toma de conciencia, comunicación e información documentada.",
    "7.1":"Recursos necesarios para el sistema (personas, infraestructura, ambiente, seguimiento y medición).",
    "7.2":"Competencia: asegurar la formación y capacitación necesarias.",
    "7.3":"Toma de conciencia del personal.",
    "7.4":"Comunicación interna y externa.",
    "7.5":"Información documentada: creación, actualización y control de documentos y registros.",
    "8":"Operación: planificación y control operacional de los procesos.",
    "8.1":"Planificación y control operacional.",
    "9":"Evaluación del desempeño: seguimiento, medición, análisis, auditoría interna y revisión por la dirección.",
    "9.1":"Seguimiento, medición, análisis y evaluación (indicadores/KPIs).",
    "9.2":"Auditoría interna.",
    "9.3":"Revisión por la dirección.",
    "10":"Mejora: no conformidades, acciones correctivas y mejora continua.",
    "10.1":"Generalidades de la mejora.",
    "10.2":"No conformidad y acción correctiva.",
    "10.3":"Mejora continua.",
  };
  function localAssistant(q){
    const t=(q||"").toLowerCase();
    const sel=aiSelectedSystem();
    const s = sel.all ? (db.systems||[])[0] : sel.system;
    const nl="\n";
    const head = s ? `**${s.org}** · ${s.norms.map(n=>NORMS[n]?NORMS[n].code:n).join(", ")}` : "";
    const cm = t.match(/(?:cl[aá]usula|punto|requisito|apartado)\s*([0-9]{1,2}(?:\.[0-9]+){0,2})/) || t.match(/\b((?:4|5|6|7|8|9|10)(?:\.[0-9]+){1,2})\b/);
    if(cm){
      const cl=cm[1]; const info=CLAUSE_INFO[cl]||CLAUSE_INFO[cl.split(".")[0]];
      let out=`**Cláusula ${cl}** — ${info||"No tengo una explicación específica de esta cláusula."}`;
      if(s){ const docs=s.docs.filter(d=>String(d.cl)===cl||String(d.cl).indexOf(cl+".")===0||cl.indexOf(String(d.cl))===0);
        if(docs.length) out+=`${nl}${nl}En tu sistema se documenta en: `+docs.map(d=>`${d.code} «${d.t}» [${d.status}]`).join("; ")+".";
        const tasks=(s.tasks||[]).filter(k=>String(k.cl)===cl);
        if(tasks.length) out+=`${nl}Tareas del plan asociadas: `+tasks.map(k=>`${k.t} [${k.status}]`).join("; ")+".";
      }
      return out;
    }
    if(/(avance|progreso|estado|implanta|c[oó]mo vamos)/.test(t) && s){
      const p=planStats(s); const ap=s.docs.filter(d=>d.status==="Aprobado").length;
      const byPhase={}; (s.tasks||[]).forEach(k=>{ (byPhase[k.phase]=byPhase[k.phase]||{t:0,i:0}); byPhase[k.phase].t++; if(k.status==="Implantado") byPhase[k.phase].i++; });
      const phaseLines=Object.keys(byPhase).sort().map(ph=>`- Cap. ${ph} ${PHASE_LABEL[ph]||""}: ${byPhase[ph].i}/${byPhase[ph].t}`).join(nl);

    }
    if(/(falta|faltan|pendiente|por aprobar|sin aprobar|aprob)/.test(t) && s){
      const pend=s.docs.filter(d=>d.status!=="Aprobado");
      if(!pend.length) return `${head}${nl}${nl}¡Enhorabuena! Todos los documentos (${s.docs.length}) están **aprobados**.`;
      const list=pend.slice(0,30).map(d=>`- ${d.code} «${d.t}» — _${d.status}_`).join(nl);
      return `${head}${nl}${nl}Te faltan **${pend.length}** documentos por aprobar (de ${s.docs.length}):${nl}${list}${pend.length>30?`${nl}… y ${pend.length-30} más.`:""}`;

    if(/(empez|empiez|por d[oó]nde|inicio|primeros pasos|arrancar|comenz)/.test(t) && s){

      const order=["4","5","6","7","8","9","10"];
      noini.sort((a,b)=>order.indexOf(a.phase)-order.indexOf(b.phase));
      const first=noini.slice(0,8).map(k=>`- [Cap. ${k.phase}] ${k.t}`).join(nl);
      return `${head}${nl}${nl}**Ruta recomendada de implantación:**${nl}1. Define el **contexto**, las **partes interesadas** y el **alcance** (cap. 4).${nl}2. Aprueba la **política** y asigna **roles** (cap. 5).${nl}3. Evalúa **riesgos** y fija **objetivos** (cap. 6).${nl}4. Asegura **competencia**, **comunicación** y **control documental** (cap. 7).${nl}5. Implanta el **control operacional** (cap. 8).${nl}6. Programa **auditorías internas** y la **revisión por la dirección** (cap. 9).${nl}7. Gestiona **no conformidades** y la **mejora** (cap. 10).${first?`${nl}${nl}**Tus próximas tareas sin iniciar:**${nl}${first}`:""}`;

      const nivel=r=>(+r.prob)*(+r.imp);
      const rs=risks.filter(r=>r.tipo!=="Oportunidad"), op=risks.filter(r=>r.tipo==="Oportunidad");

    }
    if(/(revisi[oó]n por la direcci[oó]n|acta de revisi[oó]n|revisi[oó]n de la direcci[oó]n)/.test(t) && s){

      return `${head} — ${s.docs.length} documentos:${nl}${nl}${parts}`;

    if(/(norma|iso|esquema|9001|14001|45001|22000|27001|37001|42001|50001|haccp)/.test(t) && s){
      return `${head}${nl}${nl}Tu sistema integra: ${s.norms.map(n=>`**${NORMS[n]?NORMS[n].code:n}** (${NORMS[n]?NORMS[n].name:""})`).join(", ")}.${nl}Todas comparten la estructura de alto nivel (Anexo SL, capítulos 4 a 10), por lo que se gestionan de forma integrada. Consulta el documento «Matriz de Integración» para ver la correspondencia.`;

  async function apiFetch(url, opts){
    let res;
    try{ res = await fetch(url, opts); }
    catch(e){ throw new Error("NETWORK"); }           // fetch rechazado: CORS/CSP/offline
    if(!res.ok){
      let t=""; try{ t=await res.text(); }catch(_){}
      let detail=t;
      try{ const j=JSON.parse(t); detail=(j.error&&(j.error.message||j.error))||j.message||t; }catch(_){}
      const err=new Error("HTTP "+res.status+(detail?(": "+String(detail).slice(0,300)):"")); err.http=res.status; throw err;
    }
    return res;
  }

  function aiMd(text){
    let h = esc(text);
    h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
    h = h.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(?:^|\n)#{1,4}\s*(.+)/g,"\n<strong>$1</strong>");
    // listas simples
    h = h.replace(/(?:^|\n)[-•]\s+(.+)/g,"\n<li>$1</li>");
    h = h.replace(/(<li>[\s\S]*?<\/li>)/g,"<ul>$1</ul>").replace(/<\/ul>\s*<ul>/g,"");
    h = h.replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br>");
    return "<p>"+h+"</p>";
  }

  function parseD(s){ if(!s) return null; const d = new Date(s+"T00:00:00"); return isNaN(d)?null:d; }
  function daysBetween(a,b){ return Math.round((a-b)/86400000); }
  function fmtDate(s){ const d=parseD(s); if(!d) return "—"; return d.toLocaleDateString("es-ES",{day:"2-digit",month:"short",year:"numeric"}); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function certStatus(c){
    if (c.status === "Suspendido") return "susp";
    if (c.status === "En proceso") return "prog";
    if (c.status === "Planificada") return "plan";
    const exp = parseD(c.expiryDate);
    if (!exp) return "ok";
    const d = daysBetween(exp, today());
    if (d < 0) return "bad";
    if (d <= EXPIRING_DAYS) return "warn";
    return "ok";
  }
  function certStatusLabel(c){
    const s = certStatus(c);
    if (s === "susp") return "Suspendido";
    if (s === "prog") return "En proceso";
    if (s === "plan") return "Planificada";
    if (s === "bad") return "Vencido";
    if (s === "warn") { const d = daysBetween(parseD(c.expiryDate), today()); return "Caduca en " + d + " d"; }
    return "Vigente";
  }

  function updateCounts(){

  /* ---------------- Dashboard ---------------- */
  const AGENDA_DAYS = 60;
  function collectAgenda(hz){
    const HZ = (hz==null?AGENDA_DAYS:hz);
    const items=[];
    (db.systems||[]).forEach(s=>{
      (s.tasks||[]).forEach(t=>{
        if(!t.due || t.status==="Implantado" || t.status==="No aplica") return;
        const d=daysBetween(parseD(t.due),today());
        if(d<=HZ) items.push({type:"Tarea", kindType:"task", label:t.t, sub:s.org+" · cláusula "+t.cl, date:t.due, d, goto:"sistema:"+s.id, sysId:s.id, clientId:s.clientId||null});
      });
    });
    db.audits.forEach(a=>{
      if(!a.date) return;
      const d=daysBetween(parseD(a.date),today());
      const pending=(a.result==="Pendiente"||!a.result);
      if(d<=HZ && (d>=0 || pending)) items.push({type:"Auditoría", kindType:"audit", label:(a.type||"Auditoría")+(a.standard?(" · "+a.standard):""), sub:clientName(a.clientId), date:a.date, d, goto:"view:auditorias", sysId:null, clientId:a.clientId||null});
    });
    db.certificates.forEach(c=>{
      const st=certStatus(c);
      if(st==="susp"||st==="prog"||st==="plan"||!c.expiryDate) return;
      const d=daysBetween(parseD(c.expiryDate),today());
      if(d<=HZ) items.push({type:"Certificación", kindType:"cert", label:(c.standard||"")+" — caducidad", sub:clientName(c.clientId)+(c.certNumber?(" · "+c.certNumber):""), date:c.expiryDate, d, goto:"view:certificados", sysId:null, clientId:c.clientId||null});
    });
    db.nonconformities.forEach(n=>{
      if(n.status==="Cerrada"||!n.dueDate) return;
      const d=daysBetween(parseD(n.dueDate),today());
      if(d<=HZ) items.push({type:"No conformidad", kindType:"nc", label:(n.severity||"NC")+(n.standard?(" · "+n.standard):""), sub:clientName(n.clientId)+" · cláusula "+(n.clause||"—"), date:n.dueDate, d, goto:"view:ncs", sysId:null, clientId:n.clientId||null});
    });
    (db.systems||[]).forEach(s=>{
      (s.equipment||[]).forEach(e=>{
        if(!e.proximo || e.estado==="Fuera de servicio") return;
        const d=daysBetween(parseD(e.proximo),today());
        if(d<=HZ) items.push({type:"Mantenimiento", kindType:"maint", label:(e.actividad||"Mantenimiento")+" · "+(e.nombre||e.codigo||"equipo"), sub:s.org+(e.codigo?(" · "+e.codigo):""), date:e.proximo, d, goto:"sistema:"+s.id, sysId:s.id, clientId:s.clientId||null});
      });
    });
    items.sort((a,b)=>a.d-b.d);
    return items;
  }
  // Aplica los filtros de tipo y sistema a un conjunto de la agenda
  function filterAgenda(list){
    let out=list;
    if(agendaFilter.type!=="todos") out=out.filter(i=>i.kindType===agendaFilter.type);
    if(agendaFilter.system!=="todos"){
      const sysF=getSystem(agendaFilter.system); const cid=sysF?sysF.clientId:null;
      out=out.filter(i=> i.sysId===agendaFilter.system || (cid && i.clientId===cid));
    }
    return out;
  }

  /* ---- Exportación a calendario (.ics) ---- */
  function icsEscape(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
  function icsFold(line){ let out="",s=line; while(s.length>73){ out+=s.slice(0,73)+"\r\n "; s=s.slice(73); } return out+s; }
  function icsNextDay(iso){ const p=String(iso).split("-").map(Number); const dt=new Date(Date.UTC(p[0],p[1]-1,p[2])); dt.setUTCDate(dt.getUTCDate()+1); return dt.toISOString().slice(0,10).replace(/-/g,""); }
  function exportAgendaICS(){
    const items = collectAgenda(100000); // todos los vencimientos con fecha
    if(!items.length){ toast("No hay vencimientos con fecha para exportar","warn"); return; }
    const dtstamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
    const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//IMPLANTA//Sistema de gestion//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:IMPLANTA — Agenda del sistema de gestión"];
    const rem = agendaReminder|0;
    items.forEach((it,i)=>{
      const dc=String(it.date).replace(/-/g,"");
      lines.push("BEGIN:VEVENT",
        "UID:implanta-"+i+"-"+dc+"-"+it.kindType+"@implanta.local",
        "DTSTAMP:"+dtstamp,
        "DTSTART;VALUE=DATE:"+dc,
        "DTEND;VALUE=DATE:"+icsNextDay(it.date),
        "SUMMARY:"+icsEscape("["+it.type+"] "+it.label),
        "DESCRIPTION:"+icsEscape(it.sub+" — IMPLANTA"),
        "CATEGORIES:"+icsEscape(it.type));
      if(rem>0){
        lines.push("BEGIN:VALARM","ACTION:DISPLAY",
          "DESCRIPTION:"+icsEscape("Recordatorio: "+it.type+" — "+it.label),
          "TRIGGER:-P"+rem+"D","END:VALARM");
      }
      lines.push("END:VEVENT");
    });
    lines.push("END:VCALENDAR");
    const body=lines.map(icsFold).join("\r\n");
    const blob=new Blob([body],{type:"text/calendar;charset=utf-8"});
    downloadBlob(blob, "IMPLANTA_agenda_"+new Date().toISOString().slice(0,10)+".ics");
    toast("Agenda exportada ("+items.length+" eventos"+(rem>0?", aviso "+rem+" d antes":"")+")");
  }

  function del(kind,id){
    const map = {cliente:"clients",certificado:"certificates",auditoria:"audits",nc:"nonconformities",documento:"documents"};
    const arr = map[kind];
    if(kind==="cliente"){
      const has = db.certificates.some(c=>c.clientId===id)||db.audits.some(a=>a.clientId===id);
      if(has && !confirm("Esta organización tiene certificaciones o auditorías asociadas. ¿Eliminar de todas formas? Se borrarán también sus registros vinculados.")) return;
      if(has){ db.certificates=db.certificates.filter(c=>c.clientId!==id); db.audits=db.audits.filter(a=>a.clientId!==id); db.nonconformities=db.nonconformities.filter(n=>n.clientId!==id); db.documents=db.documents.filter(d=>d.clientId!==id); }
    } else {
      if(!confirm("¿Eliminar este registro? Esta acción no se puede deshacer.")) return;
    }
    db[arr]=db[arr].filter(x=>x.id!==id);
    if(kind==="auditoria") db.nonconformities.forEach(n=>{ if(n.auditId===id) n.auditId=null; });
    save(); render(); toast("Registro eliminado","warn");
  }

  function openForm(kind,id){

      if(!db.clients.length){ toast("Primero registra los datos de tu organización","warn"); go("clientes"); return; }
    }

    const data = id ? db[store].find(x=>x.id===id) : {};

    document.getElementById("mSave").onclick = ()=>submit(kind,id);
    if(kind==="nc"){
      // Keep "Auditoría de origen" scoped to whichever client is currently selected
      const clientSel = document.getElementById("f-clientId");
      const auditSel = document.getElementById("f-auditId");
      if(clientSel && auditSel){
        const syncAudits = (keepSel)=>{ auditSel.innerHTML = auditOptions(keepSel?data.auditId:null, clientSel.value); };
        clientSel.addEventListener("change", ()=>syncAudits(false));
        syncAudits(true); // apply the filter for the default/preselected client right away
      }
      // Scope "Sistema afectado" to the client, and "Elemento vinculado" to the chosen system
      const sysSel = document.getElementById("f-systemId");
      const linkSel = document.getElementById("f-linkRef");
      if(clientSel && sysSel){
        const syncLink = (keep)=>{ if(linkSel) linkSel.innerHTML = linkRefOptions(sysSel.value, keep?data.linkRef:""); };
        const syncSystems = (keep)=>{ sysSel.innerHTML = systemOptions(keep?data.systemId:"", clientSel.value); syncLink(keep); };
        clientSel.addEventListener("change", ()=>syncSystems(false));
        sysSel.addEventListener("change", ()=>syncLink(false));
        syncSystems(true);
      }
    }
    openModal();
    const first = document.querySelector("#modalBody input, #modalBody select, #modalBody textarea");
    if(first) setTimeout(()=>first.focus(),40);

  function submit(kind,id){
    const store = STORE[kind];
    // Collect values straight from whatever fields the form actually rendered —
    // avoids keeping a second, easy-to-forget list of field names in sync with F[kind].
    const vals = {};
    document.querySelectorAll("#modalBody [data-field]").forEach(f=>{
      const k = f.dataset.field;
      const el = document.getElementById("f-"+k);
      if(el) vals[k] = el.value.trim();
    });
    // validate
    let ok = true;
    document.querySelectorAll("#modalBody .field").forEach(f=>{ f.classList.remove("invalid"); const e=f.querySelector(".err"); if(e) e.textContent="Este campo es obligatorio"; });
    (REQUIRED[kind]||[]).forEach(k=>{ if(!vals[k]){ const f=document.querySelector(`[data-field="${k}"]`); if(f){f.classList.add("invalid"); ok=false;} } });
    if(kind==="certificado" && vals.issueDate && vals.expiryDate && vals.expiryDate < vals.issueDate){
      const f=document.querySelector('[data-field="expiryDate"]'); f.classList.add("invalid"); f.querySelector(".err").textContent="La caducidad debe ser posterior a la emisión"; ok=false;
    }
    if(kind==="certificado" && vals.certNumber){
      const dupe = db.certificates.some(c=>c.id!==id && (c.certNumber||"").trim().toLowerCase()===vals.certNumber.toLowerCase());
      if(dupe){ const f=document.querySelector('[data-field="certNumber"]'); f.classList.add("invalid"); f.querySelector(".err").textContent="Ya existe un certificado con este número"; ok=false; }
    }
    if(kind==="nc" && vals.status==="Cerrada" && !vals.effectiveness){
      const f=document.querySelector('[data-field="effectiveness"]'); f.classList.add("invalid"); f.querySelector(".err").textContent="Registra la verificación de eficacia antes de cerrar la NC"; ok=false;
    }
    if(!ok){ toast("Revisa los campos marcados","bad"); return; }

    const now = stamp();
    let rec;
    if(id){
      rec = db[store].find(x=>x.id===id);
      Object.assign(rec, vals, {updatedAt:now});
    } else {
      rec = Object.assign({id:uid(kind.slice(0,3)), createdAt:now, updatedAt:now}, vals);
      db[store].push(rec);
    }
    if(kind==="nc"){
      rec.fiveWhys=[vals.why1,vals.why2,vals.why3,vals.why4,vals.why5].map(x=>(x||"").trim());
      rec.ishikawa={manoObra:vals.ish_mo||"",metodo:vals.ish_met||"",maquinaria:vals.ish_maq||"",material:vals.ish_mat||"",medicion:vals.ish_med||"",medioAmbiente:vals.ish_amb||""};
      ["why1","why2","why3","why4","why5","ish_mo","ish_met","ish_maq","ish_mat","ish_med","ish_amb"].forEach(k=>delete rec[k]);
    }
    reconcileStatuses();
    save(); closeModal(); render();
    toast(id?"Cambios guardados":"Registro guardado");
  }

  /* ---------------- Export / reset ---------------- */
  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download=filename;
    a.click(); URL.revokeObjectURL(url);
  }

  function exportJSON(){
    const payload = Object.assign({ _implanta:true, _version:1, _exportedAt:stamp() }, db);
    delete payload._sync;
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    downloadBlob(blob, "implanta-copia-"+new Date().toISOString().slice(0,10)+".json");
    toast("Copia de seguridad exportada");
  }
  function importBackup(file){
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(reader.result); }
      catch(e){ toast("El archivo no es un JSON válido","bad"); return; }
      const looksValid = data && typeof data==="object" && ["clients","certificates","audits","nonconformities","documents"].every(k=>Array.isArray(data[k]));
      if(!looksValid){ toast("El archivo no parece una copia de IMPLANTA","bad"); return; }
      const nSys=Array.isArray(data.systems)?data.systems.length:0;
      if(!confirm(`Se reemplazarán TODOS los datos actuales por los de la copia:\n\n· ${data.clients.length} organización(es)\n· ${data.certificates.length} certificación(es)\n· ${data.audits.length} auditoría(s)\n· ${data.nonconformities.length} no conformidad(es)\n· ${nSys} sistema(s) de gestión\n\n¿Continuar?`)) return;
      const keepSync = db._sync || {url:"",auto:false,last:""};
      db = {
        clients:data.clients, certificates:data.certificates, audits:data.audits,
        nonconformities:data.nonconformities, documents:data.documents,
        systems:Array.isArray(data.systems)?data.systems:[], _sync:keepSync
      };
      db.systems.forEach(s=>{ if(!Array.isArray(s.tasks)) s.tasks=buildTaskSet(s.norms, s.docs); ensureModules(s); });
      reconcileStatuses();
      openSystemId=null; sysTab="docs"; current="dashboard";
      save(); render();
      toast("Copia de seguridad importada");
    };
    reader.onerror = () => toast("No se pudo leer el archivo","bad");
    reader.readAsText(file);
  }

  function toCSV(rows){
    if(!rows.length) return "";
    const headers = Object.keys(rows[0]);
    const cell = (v)=>{
      const s = v==null ? "" : String(v);
      return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    };
    const lines = [headers.map(cell).join(",")];
    rows.forEach(r=> lines.push(headers.map(h=>cell(r[h])).join(",")));
    return lines.join("\r\n");
  }

  async function exportCSV(){
    if(typeof JSZip === "undefined"){ toast("No se pudo cargar el generador de CSV","bad"); return; }
    const tables = tablesForExport();
    const zip = new JSZip();
    Object.entries(tables).forEach(([name, rows])=>{
      // BOM so accents/ñ display correctly when opened in Excel
      zip.file(name.toLowerCase()+".csv", "\uFEFF"+toCSV(rows));
    });
    const blob = await zip.generateAsync({type:"blob"});
    downloadBlob(blob, "implanta-registros-csv-"+new Date().toISOString().slice(0,10)+".zip");
    toast("CSV exportados ("+Object.keys(tables).length+" archivos en .zip)");
  }

  function exportXLSX(){
    if(typeof XLSX === "undefined"){ toast("No se pudo cargar el generador de Excel","bad"); return; }
    const tables = tablesForExport();
    const wb = XLSX.utils.book_new();
    Object.entries(tables).forEach(([name, rows])=>{
      const ws = XLSX.utils.json_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb, ws, name.replace(/_/g," ").slice(0,31));
    });
    XLSX.writeFile(wb, "implanta-registros-"+new Date().toISOString().slice(0,10)+".xlsx");
    toast("Registros exportados a Excel");
  }

  /* ---- Construcción del conjunto documental (deduplicado + integrado) ---- */
  function buildDocSet(norms){
    const has = (id)=>norms.includes(id);
    const hlsNorms = norms.filter(n=>NORMS[n] && NORMS[n].hls);
    const hasHLS = hlsNorms.length>0;
    let flat = [];

    const commonSel = hasHLS ? COMMON_DOCS : COMMON_DOCS.filter(d=>["manual","alcance","control-doc"].includes(d.k));
    const commonNorms = hasHLS ? hlsNorms.slice() : norms.slice();
    commonSel.forEach(d=> flat.push(Object.assign({}, d, {norms:commonNorms.slice()})));

    // Documento de integración entre esquemas (solo en sistemas con 2+ normas)
    if(hasHLS && norms.length>=2){
      flat.push({k:"integracion", t:"Matriz de Integración y Correspondencia entre Normas", cat:"marco", cl:"4.4", d:"correspondencia entre los esquemas integrados y su documentación común", norms:hlsNorms.slice()});
    }

    norms.forEach(n=>{ (NORM_DOCS[n]||[]).forEach(d=> flat.push(Object.assign({}, d, {norms:[n]}))); });

    // Fusionar requisitos compartidos
    Object.entries(MERGE).forEach(([mk,mdef])=>{
      const present = flat.filter(x=>mdef.members.includes(x.k));
      if(present.length>=2){
        const unionNorms = [...new Set(present.flatMap(x=>x.norms))];
        flat = flat.filter(x=>!mdef.members.includes(x.k));
        flat.push({k:mk, t:mdef.t, cat:mdef.cat, cl:mdef.cl, d:mdef.d, norms:unionNorms});
      }
    });

    // Ordenar por categoría y asignar código
    flat.sort((a,b)=> CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat));
    const counters = {};
    flat.forEach(d=>{
      const pfx = CODEPFX[d.cat]||"DOC";
      counters[pfx] = (counters[pfx]||0)+1;
      d.code = pfx+"-"+String(counters[pfx]).padStart(2,"0");
      d.version = d.version||"1.0";
      d.status = d.status||"Pendiente";
      d.history = [{v:d.version, date:stamp(), action:"Documento generado", note:""}];
    });
    return flat;
  }

  function buildSystem(input){
    const norms = (input.norms||[]).filter(n=>NORMS[n]);
    const docs = buildDocSet(norms);
    return {
      id: input.id||uid("sys"),
      org: input.org||"Organización",
      clientId: input.clientId||null,
      sector: input.sector||SECTOR_LIST[0],
      norms, scope: input.scope||"", activities: input.activities||"",
      sites: input.sites||"", headcount: input.headcount||"", responsible: input.responsible||"",
      docs, tasks: buildTaskSet(norms, docs),
      risks: [], foda: {f:"",o:"",d:"",a:""}, suppliers: [], kpis: [], comps: [], trainings: [], reviews: [], equipment: [], legal: [],
      createdAt: input.createdAt||stamp(), updatedAt: stamp()
    };
  }
  // Garantiza que un sistema tenga inicializados los módulos de gestión (migración segura)
  function ensureModules(s){
    if(!Array.isArray(s.risks)) s.risks=[];
    if(!s.foda || typeof s.foda!=="object") s.foda={f:"",o:"",d:"",a:""};
    if(!Array.isArray(s.suppliers)) s.suppliers=[];
    if(!Array.isArray(s.kpis)) s.kpis=[];
    if(!Array.isArray(s.comps)) s.comps=[];
    if(!Array.isArray(s.trainings)) s.trainings=[];
    if(!Array.isArray(s.reviews)) s.reviews=[];
    if(!Array.isArray(s.equipment)) s.equipment=[];
    if(!Array.isArray(s.legal)) s.legal=[];
    return s;
  }
  // Reconstruye docs conservando estado y ediciones al cambiar normas
  function rebuildSystemDocs(sys){
    const prev = {}; (sys.docs||[]).forEach(d=> prev[d.k]={status:d.status, custom:d.custom, version:d.version, history:d.history});
    sys.docs = buildDocSet(sys.norms).map(d=>{
      if(prev[d.k]){ d.status=prev[d.k].status||d.status; if(prev[d.k].custom!=null) d.custom=prev[d.k].custom; d.version=prev[d.k].version||d.version; if(Array.isArray(prev[d.k].history)) d.history=prev[d.k].history; }
      return d;
    });
  }
  // --- Historial de versiones y trazabilidad de documentos ---
  function logDocHistory(doc, action, note){ if(!Array.isArray(doc.history)) doc.history=[]; doc.history.push({v:doc.version, date:stamp(), action:action, note:note||""}); }
  function bumpVersion(v){ const p=String(v||"1.0").split("."); const maj=parseInt(p[0],10)||1; const min=(parseInt(p[1],10)||0)+1; return maj+"."+min; }
  function ncsForDoc(sysId, docKey){ return db.nonconformities.filter(n=>n.systemId===sysId && n.linkRef==="doc:"+docKey); }
  function ncsForTask(sysId, taskKey){ return db.nonconformities.filter(n=>n.systemId===sysId && n.linkRef==="task:"+taskKey); }
  function gotoNc(id){ if(docReaderState) closeDocReader(); go("ncs"); setTimeout(()=>openForm("nc",id),0); }
  const getSystem = (id)=> (db.systems||[]).find(s=>s.id===id);
  function deleteSystem(id){
    const s=getSystem(id); if(!s) return;
    if(!confirm(`¿Eliminar el sistema de gestión «${s.org}»?\n\nSe borrarán sus ${s.docs.length} documentos y su plan de implantación (${(s.tasks||[]).length} tareas). Esta acción no se puede deshacer.`)) return;
    db.systems = (db.systems||[]).filter(x=>x.id!==id);
    // Limpiar los vínculos de no conformidades que apuntaban a este sistema
    db.nonconformities.forEach(n=>{ if(n.systemId===id){ n.systemId=""; n.linkRef=""; } });
    openSystemId=null; sysTab="docs";
    save(); render();
    toast("Sistema eliminado");
  }

  const TASK_STATUSES = ["No iniciado","En curso","Implantado","No aplica"];
  const taskStatusKind = (st)=> st==="Implantado"?"ok":st==="En curso"?"warn":st==="No aplica"?"susp":"bad";
  const PLAN_PHASES = [
    {n:"4", t:"Contexto de la organización"},
    {n:"5", t:"Liderazgo"},
    {n:"6", t:"Planificación"},
    {n:"7", t:"Apoyo"},
    {n:"8", t:"Operación"},
    {n:"9", t:"Evaluación del desempeño"},
    {n:"10", t:"Mejora"},
  ];
  const PHASE_LABEL = Object.fromEntries(PLAN_PHASES.map(p=>[p.n,p.t]));
  function chapterOf(cl){
    const s=String(cl||"");
    if(/^A|Anexo|Paso|Base|^P\d/i.test(s)) return "8";
    const m=s.match(/(\d+)/); const n=m?parseInt(m[1],10):0;
    return (n>=4&&n<=10)?String(n):"8";
  }
  // Actividades de gestión no ligadas a un documento concreto (siempre presentes en un sistema HLS)
  const CORE_ACTIVITIES = [
    {k:"core-5.1", cl:"5.1",  t:"Asegurar el liderazgo y compromiso de la alta dirección"},
    {k:"core-7.1", cl:"7.1",  t:"Proporcionar los recursos necesarios para el sistema"},
    {k:"core-7.3", cl:"7.3",  t:"Desarrollar la toma de conciencia del personal"},
    {k:"core-9.1", cl:"9.1",  t:"Implantar el seguimiento, la medición y el análisis de resultados"},
  ];
  // Genera el plan de tareas a partir de las normas y del conjunto documental del sistema
  function buildTaskSet(norms, docs){
    const hasHLS = (norms||[]).some(n=>NORMS[n] && NORMS[n].hls);
    const tasks = [];
    if(hasHLS){
      CORE_ACTIVITIES.forEach(a=> tasks.push({ k:a.k, cl:a.cl, phase:chapterOf(a.cl), t:a.t, norms:[], docKey:null, status:"No iniciado", responsible:"", due:"" }));
    }
    (docs||[]).forEach(d=>{
      tasks.push({ k:"doc:"+d.k, cl:d.cl, phase:chapterOf(d.cl), t:"Elaborar e implantar «"+d.t+"»", norms:d.norms||[], docKey:d.k, status:"No iniciado", responsible:"", due:"" });
    });
    // Orden por capítulo y por cláusula
    const chOrder = ["4","5","6","7","8","9","10"];
    tasks.sort((a,b)=> chOrder.indexOf(a.phase)-chOrder.indexOf(b.phase) || String(a.cl).localeCompare(String(b.cl),"es",{numeric:true}));
    return tasks;
  }
  // Reconstruye el plan conservando estado, responsable y plazo por clave de tarea
  function rebuildSystemTasks(sys){
    const prev={}; (sys.tasks||[]).forEach(t=> prev[t.k]={status:t.status, responsible:t.responsible, due:t.due});
    sys.tasks = buildTaskSet(sys.norms, sys.docs).map(t=>{
      if(prev[t.k]){ t.status=prev[t.k].status||t.status; t.responsible=prev[t.k].responsible||""; t.due=prev[t.k].due||""; }
      return t;
    });
  }
  // Métricas de implantación de un sistema (excluye "No aplica" del denominador)
  function planStats(sys){
    const ts=(sys.tasks||[]);
    const aplicables=ts.filter(t=>t.status!=="No aplica");
    const impl=ts.filter(t=>t.status==="Implantado").length;
    const curso=ts.filter(t=>t.status==="En curso").length;
    const noini=ts.filter(t=>t.status==="No iniciado").length;
    const na=ts.filter(t=>t.status==="No aplica").length;
    const pct=aplicables.length?Math.round(impl/aplicables.length*100):0;
    return {total:ts.length, aplicables:aplicables.length, impl, curso, noini, na, pct};
  }
